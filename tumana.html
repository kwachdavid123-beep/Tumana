(function(){
  var alreadyCleared = window.location.search.indexOf('_cleared=1') >= 0;
  if (alreadyCleared) return; 

  if ('serviceWorker' in navigator) {
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }));
      }),
      ('caches' in window) ? caches.keys().then(function(keys){

      }) : Promise.resolve()
    ]).then(function(){
      var sep = window.location.href.indexOf('?') >= 0 ? '&' : '?';

    }).catch(function(){
      var sep = window.location.href.indexOf('?') >= 0 ? '&' : '?';

var NAV_HIST=[];
function navPush(fn,args){

function dbGet(col,id,cb){loadFB(function(db){if(!db){cb(null);return;}db.collection(col).doc(id).get().then(function(d){cb(d.exists?Object.assign({id:d.id},d.data()):null);}).catch(function(){cb(null);});});}
function dbSet(col,id,data){loadFB(function(db){if(!db)return;db.collection(col).doc(id).set(data,{merge:true}).catch(function(){});});}
function dbAll(col,cb){loadFB(function(db){if(!db){cb([]);return;}db.collection(col).limit(200).get().then(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){cb([]);});});}
function dbListen(col,f,op,v,cb){var unsub=null;loadFB(function(db){if(!db){cb([]);return;}unsub=db.collection(col).where(f,op,v).limit(50).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){cb([]);});});return function(){if(unsub)unsub();};}
function dbListenIn(col,f,vals,cb){var unsub=null;loadFB(function(db){if(!db){cb([]);return;}unsub=db.collection(col).where(f,'in',vals).limit(100).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){cb([]);});});return function(){if(unsub)unsub();};}

    rider:[['jobs','&#x1F4E6;','Jobs'],['earn','&#x1F4B0;','Earn'],['profile','&#x1F464;','Me']],

  };
  var items=NAVS[role]||[];
  nav.style.display='flex';

    var active=item[0]===tab;
    nav.innerHTML+=('<div data-nav="'+item[0]+'" style="flex:1;text-align:center;padding:10px 0;cursor:pointer;opacity:'+(active?'1':'.45')+'"><div style="font-size:22px">'+item[1]+'</div><div style="font-size:10px;font-weight:700;margin-top:2px">'+item[2]+'</div></div>');
  });
  nav.innerHTML+='</div>';
  nav.querySelectorAll('[data-nav]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var t=this.getAttribute('data-nav');
      if(role==='customer'){if(t==='home')showHome();else if(t==='search')showItemSearch();else if(t==='orders')showOrds();else if(t==='pickup')showPickup();else showProfile();}
      else if(role==='shop'){if(t==='orders')showSOrd();else if(t==='sales')showSSales();else if(t==='stock')showSStock();else if(t==='insights')showSInsights();else showSSet();}

function startCust(){
  SHOPS=MSHOPS;
  // Load cached shops for instant display
  try{var cs=JSON.parse(localStorage.getItem('tumana_shops')||'[]');if(cs.length)SHOPS=cs;}catch(e){}
  loadFB(function(db){
    if(!db){showHome();return;}
    db.collection('shops').where('verified','==',true).get().then(function(s){
      var ok=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(sh){return sh.subscription_paid!==false;});
      ok.sort(function(a,b){return(b.delivery_enabled===true?1:0)-(a.delivery_enabled===true?1:0);});
      if(ok.length){SHOPS=ok;try{localStorage.setItem('tumana_shops',JSON.stringify(ok));}catch(e){}}
    }).catch(function(){try{var cs2=JSON.parse(localStorage.getItem('tumana_shops')||'[]');if(cs2.length){SHOPS=cs2;toast('Showing cached shops — offline');}}catch(e){}});
  });

}

function showShopDetail(shopId,shopName){
  navPush(showShopDetail,[shopId,shopName]);
  setTitle(shopName||'Shop','#10b981');setNav('customer','home');
  pg().innerHTML='<div style="padding:14px 18px 8px;display:flex;align-items:center;gap:10px"><button onclick="navBack()" style="background:none;border:none;font-size:22px;cursor:pointer;color:rgba(255,255,255,.6)">&#x2190;</button><div style="font-size:16px;font-weight:800">'+(shopName||'Shop')+'</div></div>'
    +'<div id="sarea" style="padding:0 18px 100px"><div style="text-align:center;padding:30px"><div class="spin" style="margin:0 auto"></div></div></div>';
  loadFB(function(db){
    if(!db){document.getElementById('sarea').innerHTML='<div style="padding:20px;color:rgba(255,255,255,.4)">Connect to browse items</div>';return;}
    db.collection('shops').doc(shopId).collection('stock').where('quantity','>',0).get()
      .then(function(snap){
        var prods=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        var area=document.getElementById('sarea');if(!area)return;
        if(!prods.length){area.innerHTML=empty('&#x1F4E6;','No items listed','Shop has not added stock yet');return;}
        renderProds(prods,area);
        wireCartButtons();
      }).catch(function(){document.getElementById('sarea').innerHTML='<div style="padding:20px;color:rgba(255,255,255,.4)">Error loading items</div>';});
  });
}
function renderProds(prods,area){
  var h='';
  prods.forEach(function(p){
    var qty=0;CART.forEach(function(ci){if(ci.id===p.id)qty=ci.qty;});
    h+='<div style="background:#111116;border:1.5px solid rgba(255,255,255,.07);border-radius:14px;margin-bottom:10px;overflow:hidden">';
    if(p.photo){h+='<div style="width:100%;height:180px;overflow:hidden"><img src="'+p.photo+'" style="width:100%;height:100%;object-fit:cover" loading="lazy"></div>';}
    h+='<div style="padding:12px"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><div style="font-size:15px;font-weight:800;color:#fff">'+(p.photo?'':((p.emoji||'&#x1F4E6;')+' '))+p.name+'</div><div style="font-size:17px;font-weight:800;color:#10b981;white-space:nowrap;margin-left:8px">KSh '+p.selling_price+'</div></div>';
    if(p.description){h+='<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:6px;line-height:1.5">'+p.description+'</div>';}
    if(p.bulk_qty&&p.bulk_price){h+='<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:7px;padding:5px 10px;margin-bottom:8px;font-size:11px;font-weight:700;color:#f59e0b">&#x1F4B0; '+p.bulk_qty+' for KSh '+p.bulk_price+'</div>';}
    var totP=(p.bulk_qty&&p.bulk_price&&qty>=p.bulk_qty)?Math.floor(qty/p.bulk_qty)*p.bulk_price+(qty%p.bulk_qty)*p.selling_price:p.selling_price*qty;
    var isBulk=!!(p.bulk_qty&&p.bulk_price&&qty>=p.bulk_qty);
    if(qty>0){
      h+='<div class="qrow" style="margin-bottom:0'+(isBulk?';background:rgba(245,158,11,.06)':'')+'"><button class="qb cm" data-bq="'+(p.bulk_qty||0)+'" data-bp="'+(p.bulk_price||0)+'" style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2);width:36px;height:36px" data-id="'+p.id+'" data-n="'+p.name+'" data-p="'+p.selling_price+'">&#x2212;</button>';
      h+='<span style="font-weight:800;font-size:16px;min-width:28px;text-align:center">'+qty+'</span>';
      h+='<button class="qb cp" data-bq="'+(p.bulk_qty||0)+'" data-bp="'+(p.bulk_price||0)+'" style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2);width:36px;height:36px" data-id="'+p.id+'" data-n="'+p.name+'" data-p="'+p.selling_price+'">+</button>';
      h+='<span style="flex:1"></span><div style="text-align:right">'+(isBulk?'<div style="font-size:9px;color:#f59e0b;font-weight:700">BULK</div>':'')+'<span style="font-size:13px;font-weight:800;color:'+(isBulk?'#f59e0b':'#10b981')+'">KSh '+totP+'</span></div></div>';
    }else{
      h+='<button class="addb ca" data-id="'+p.id+'" data-n="'+p.name+'" data-p="'+p.selling_price+'" data-bq="'+(p.bulk_qty||0)+'" data-bp="'+(p.bulk_price||0)+'" style="font-size:13px;padding:9px">+ Add to Cart</button>';
    }
    h+='</div></div>';
  });
  area.innerHTML=h;
}
function wireCartButtons(){
  var area=document.getElementById('sarea');if(!area)return;
  area.querySelectorAll('.ca').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.getAttribute('data-id');var n=this.getAttribute('data-n');
      var p=parseFloat(this.getAttribute('data-p'));
      var bq=parseInt(this.getAttribute('data-bq'))||0;var bp=parseFloat(this.getAttribute('data-bp'))||0;
      var existing=CART.find(function(c){return c.id===id;});
      if(existing){existing.qty++;existing.bulk_qty=bq;existing.bulk_price=bp;}
      else CART.push({id:id,name:n,price:p,qty:1,bulk_qty:bq,bulk_price:bp,shopId:CS.id,shopName:CS.name,shopDist:CS.distance_km||0.5});
      toast(n+' added to cart');
      loadFB(function(db){
        if(!db)return;
        db.collection('shops').doc(CS.id).collection('stock').where('quantity','>',0).get()
          .then(function(snap){var prods=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});var area2=document.getElementById('sarea');if(area2){renderProds(prods,area2);wireCartButtons();}});
      });
    });
  });
  area.querySelectorAll('.cp').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.getAttribute('data-id');var bq=parseInt(this.getAttribute('data-bq'))||0;var bp=parseFloat(this.getAttribute('data-bp'))||0;
      var ci=CART.find(function(c){return c.id===id;});
      if(ci){ci.qty++;ci.bulk_qty=bq;ci.bulk_price=bp;}
      loadFB(function(db){if(!db)return;db.collection('shops').doc(CS.id).collection('stock').where('quantity','>',0).get().then(function(snap){var prods=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});var area2=document.getElementById('sarea');if(area2){renderProds(prods,area2);wireCartButtons();}});});
    });
  });
  area.querySelectorAll('.cm').forEach(function(btn){
    btn.addEventListener('click',function(){
      var id=this.getAttribute('data-id');
      var ci=CART.find(function(c){return c.id===id;});
      if(ci){if(ci.qty>1)ci.qty--;else CART=CART.filter(function(c){return c.id!==id;});}
      loadFB(function(db){if(!db)return;db.collection('shops').doc(CS.id).collection('stock').where('quantity','>',0).get().then(function(snap){var prods=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});var area2=document.getElementById('sarea');if(area2){renderProds(prods,area2);wireCartButtons();}});});
    });
  });
}
// ── CART & CHECKOUT ──────────────────────────────────────────────────
function showCart(){
  navPush(showCart);
  setTitle('TUMANA','#10b981');setNav('customer','home');
  if(!CART.length){pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:700">Cart</div></div>'+empty('&#x1F6D2;','Cart is empty','Browse shops and add items');return;}
  var sub=CART.reduce(function(s,i){var q=i.qty||1;var p=i.price||0;var bq=i.bulk_qty||0;var bp=i.bulk_price||0;return s+((bq>=2&&bp>0&&q>=bq)?Math.floor(q/bq)*bp+(q%bq)*p:p*q);},0);
  var h='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:700;margin-bottom:12px">Your Cart</div>';
  if(CS&&CS.name)h+='<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px">&#x1F3EA; '+CS.name+'</div>';
  CART.forEach(function(i){
    var q=i.qty||1;var p=i.price||0;var bq=i.bulk_qty||0;var bp=i.bulk_price||0;
    var totP=(bq>=2&&bp>0&&q>=bq)?Math.floor(q/bq)*bp+(q%bq)*p:p*q;var isBulk=!!(bq&&bp&&q>=bq);
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)">';
    h+='<div><div style="font-size:14px;font-weight:700">'+i.name+'</div><div style="font-size:11px;color:rgba(255,255,255,.4)">×'+q+(isBulk?' · BULK':' · KSh '+p+' each')+'</div></div>';
    h+='<div style="font-weight:800;color:'+(isBulk?'#f59e0b':'#10b981')+'">KSh '+totP+'</div></div>';
  });
  var estDf=calcFee(CART[0].shopDist||0.5);
  h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:2px"><div style="font-size:14px;font-weight:700">Goods Subtotal</div><div style="font-size:20px;font-weight:800">KSh '+sub+'</div></div>';
  h+='<div style="background:rgba(16,185,129,.05);border:1.5px solid rgba(16,185,129,.15);border-radius:11px;padding:12px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:12px;color:rgba(255,255,255,.4)">Estimated delivery fee</div><div style="font-size:10px;color:rgba(255,255,255,.3)">Exact fee shown after entering destination</div></div><div id="fee-est-val" style="font-size:18px;font-weight:800;color:#10b981">~KSh '+estDf+'</div></div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)"><div style="font-size:12px;color:rgba(255,255,255,.4)">Estimated total</div><div style="font-size:14px;font-weight:800;color:rgba(255,255,255,.7)">~KSh '+(sub+estDf)+'</div></div>'
    +'</div>';
  h+='<button id="proceed-checkout" class="btn bg" style="font-size:16px;padding:16px">Enter Delivery Location &#x1F4CD;</button>';
  h+='<button id="clear-cart" class="btn bo" style="margin-top:6px;font-size:12px;padding:10px">Clear Cart</button>';
  h+='</div>';
  pg().innerHTML=h;
  document.getElementById('clear-cart').addEventListener('click',function(){if(!confirm('Clear your cart?'))return;CART=[];showHome();});
  document.getElementById('proceed-checkout').addEventListener('click',function(){
    showSh('<div class="hd"></div><div style="font-size:18px;font-weight:800;margin-bottom:4px">&#x1F4CD; Delivery Location</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:12px">Enter where to deliver — fee is calculated from your GPS</div>'
      +'<div class="fld"><label>Your Address / House</label><input id="del-addr" type="text" placeholder="e.g. House No.5, Kisumu Road" autocomplete="off"></div>'
      +'<div class="fld"><label>Nearest Landmark</label><input id="del-land" type="text" placeholder="e.g. Opposite Market, near school gate" autocomplete="off"></div>'
      +'<button id="del-gps-btn" style="width:100%;padding:10px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px">&#x1F4CD; Use My GPS Location (auto-calculates fee)</button>'
      +'<div id="fee-live-box" style="display:none;background:rgba(16,185,129,.06);border:1.5px solid rgba(16,185,129,.25);border-radius:11px;padding:12px;margin-bottom:12px">'
      +'<div style="display:flex;justify-content:space-between"><span style="font-size:12px;color:rgba(255,255,255,.4)">Goods</span><span style="font-weight:700">KSh '+sub+'</span></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:12px;color:rgba(255,255,255,.4)">Delivery</span><span id="fee-live-val" style="font-weight:800;color:#10b981">KSh ?</span></div>'
      +'<div style="display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.08)"><span style="font-size:13px;font-weight:700">Total</span><span id="total-live-val" style="font-weight:800;font-size:16px">KSh ?</span></div>'
      +'<div id="dist-label" style="font-size:10px;color:rgba(255,255,255,.3);margin-top:4px"></div>'
      +'</div>'
      +'<button id="calc-fee-btn" class="btn ba" style="margin-bottom:8px">&#x1F4CF; Calculate Delivery Fee</button>'
      +'<button id="del-next" class="btn bg" style="margin-top:0;display:none">&#x2705; Confirm Order</button>'
      +'<button id="del-cancel" class="btn bo" style="margin-top:6px">Cancel</button>'
    );
    document.getElementById('del-cancel').addEventListener('click',hideSh);
    document.getElementById('del-gps-btn').addEventListener('click',function(){
      var btn=this;btn.disabled=true;btn.textContent='Getting location...';
      getGPSRobust(function(lat,lng,acc){
        btn.disabled=false;
        var addrEl=document.getElementById('del-addr');
        if(addrEl&&!addrEl.value)addrEl.value='My GPS Location (±'+acc+'m)';
        btn.textContent='GPS captured (±'+acc+'m)';btn.style.color='#10b981';
        autoCalcFee();
      },function(msg){btn.disabled=false;btn.textContent='GPS failed — type address above';btn.style.color='#ef4444';},btn);
    });
    function autoCalcFee(){
      var shopLat=CS&&CS.lat;var shopLng=CS&&CS.lng;
      var df=calcFee(CART[0].shopDist||0.5);var km=CART[0].shopDist||0.5;
      if(window._custLat&&window._custLng&&shopLat&&shopLng){km=Math.max(0.2,Math.round(haversineKm(shopLat,shopLng,window._custLat,window._custLng)*10)/10);df=calcFee(km);}
      else if(window._custLat&&window._custLng){km=Math.max(0.2,Math.round(haversineKm(-0.0236,35.0182,window._custLat,window._custLng)*10)/10);df=calcFee(km);}
      window._finalDf=df;window._finalKm=km;
      var fbox=document.getElementById('fee-live-box');if(fbox)fbox.style.display='block';
      var fv=document.getElementById('fee-live-val');if(fv)fv.textContent='KSh '+df;
      var tv=document.getElementById('total-live-val');if(tv)tv.textContent='KSh '+(sub+df);
      var dl=document.getElementById('dist-label');if(dl)dl.textContent='Distance: ~'+km+'km';
      var nb=document.getElementById('del-next');if(nb)nb.style.display='block';
    }
    document.getElementById('calc-fee-btn').addEventListener('click',function(){var addr=(document.getElementById('del-addr').value||'').trim();if(!addr){toast('Enter your delivery address or use GPS');return;}autoCalcFee();});
    document.getElementById('del-next').addEventListener('click',function(){
      var addr=(document.getElementById('del-addr').value||'').trim();var land=(document.getElementById('del-land').value||'').trim();
      if(!addr){toast('Enter delivery address first');return;}
      window._deliveryAddr=[addr,land].filter(Boolean).join(' — ');
      var df=window._finalDf||calcFee(CART[0].shopDist||0.5);
      hideSh();showPaymentSheet(sub,df);
    });
  });
}
function showPaymentSheet(sub,df){
  var total=sub+df;
  showSh('<div class="hd"></div><div style="font-size:18px;font-weight:800;margin-bottom:14px">Confirm Order</div>'
    +'<div style="background:#1a1a22;border-radius:11px;padding:12px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.4);font-size:13px">Goods</span><span style="font-weight:700">KSh '+sub+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:5px 0"><span style="color:rgba(255,255,255,.4);font-size:13px">Delivery</span><span style="font-weight:700;color:#10b981">KSh '+df+'</span></div>'
    +'<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:4px"><span style="font-size:14px;font-weight:800">Total</span><span style="font-size:20px;font-weight:800">KSh '+total+'</span></div>'
    +'<div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:4px">&#x1F4CD; '+(window._deliveryAddr||'Your location')+'</div>'
    +'</div>'
    +'<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px">You will pay shop via M-Pesa after they accept your order.</div>'
    +'<button id="sn" class="btn bg" style="font-size:15px;padding:15px">&#x2705; Place Order</button>'
    +'<button id="cn" class="btn bo" style="margin-top:6px">Back</button>'
  );
  document.getElementById('cn').addEventListener('click',hideSh);
  document.getElementById('sn').addEventListener('click',function(){placeOrder('mpesa','');});
}
function placeOrder(payMethod,mpesaCode){
  if(!CART.length){toast('Cart is empty');return;}
  var shop=CS||{};var shopId=shop.id||CART[0].shopId||'';
  var sub=CART.reduce(function(s,i){var q=i.qty||1;var p=i.price||0;var bq=i.bulk_qty||0;var bp=i.bulk_price||0;return s+((bq>=2&&bp>0&&q>=bq)?Math.floor(q/bq)*bp+(q%bq)*p:p*q);},0);
  var df=window._finalDf||calcFee(CART[0].shopDist||0.5);
  var addr=window._deliveryAddr||USER.name+' waiting';
  var orderData={type:'shop',customer_phone:USER.phone,customer_name:USER.name,shop_id:shopId,shopName:shop.name||CART[0].shopName||'',delivery_address:addr,
    items:CART.map(function(i){return{id:i.id,name:i.name,quantity:i.qty,price:i.price};}),
    subtotal:sub,delivery_fee:df,total:sub+df,rider_earnings:df,platform_earnings:0,distance:CART[0].shopDist||0.5,
    status:'placed',payment_method:payMethod,rider_phone:null,rider_name:null,ts:Date.now()
  };
  if(window._custLat){orderData.delivery_lat=window._custLat;orderData.delivery_lng=window._custLng;}
  hideSh();
  loadFB(function(db){
    if(!db){toast('No connection — cannot place order');return;}
    db.collection('delivery_orders').add(Object.assign({},orderData,{ts:firebase.firestore.FieldValue.serverTimestamp()}))
      .then(function(){CART=[];window._deliveryAddr='';window._finalDf=0;toast('Order placed! Shop will review shortly.');showOrds();})
      .catch(function(){toast('Error placing order — check connection');});
  });
}
// ── CUSTOMER: ORDERS TRACKING ────────────────────────────────────────
function showOrds(){
  navPush(showOrds);

    var list=document.getElementById('ordlist');if(!list)return;

      else if(o.status==='picked'){statusMsg='<div style="font-size:12px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:8px 10px;margin-bottom:8px;color:#10b981">&#x1F4E6; Order picked up — coming to you now!</div>';}

        var oid=this.getAttribute('data-id');

        if(!code||code.length<6){toast('Enter your M-Pesa confirmation code');return;}
        var b=this;b.textContent='Confirming...';b.disabled=true;

      });

function showPickup(){
  navPush(showPickup);
  setTitle('PICKUP','#10b981');setNav('customer','pickup');
  window._gpsLat=null;window._gpsLng=null;window._dropLat=null;window._dropLng=null;
  var estDf=calcFee(1);
  pg().innerHTML='<div style="padding:14px 18px 100px">'
    +'<div style="font-size:19px;font-weight:700;margin-bottom:14px">Request a Rider</div>'
    +'<div style="font-size:10px;font-weight:800;color:#10b981;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">&#x1F7E2; Pickup From</div>'
    +'<div style="background:#111116;border:1.5px solid rgba(16,185,129,.3);border-radius:13px;padding:13px;margin-bottom:10px">'
    +'<input id="pfr" type="text" placeholder="Where should rider pick up from?" style="background:transparent;border:none;font-size:15px;color:#fff;font-family:inherit;width:100%;outline:none;margin-bottom:8px">'
    +'<button id="gps-pick" style="width:100%;padding:9px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;color:#10b981;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#x1F4CD; Use My Current GPS Location</button>'
    +'<div id="gps-pick-st" style="font-size:11px;color:rgba(255,255,255,.35);text-align:center;margin-top:4px"></div></div>'
    +'<div style="font-size:10px;font-weight:800;color:#ef4444;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">&#x1F534; Drop Off To</div>'
    +'<div style="background:#111116;border:1.5px solid rgba(239,68,68,.3);border-radius:13px;padding:13px;margin-bottom:10px">'
    +'<input id="pto" type="text" placeholder="Where should rider deliver to?" style="background:transparent;border:none;font-size:15px;color:#fff;font-family:inherit;width:100%;outline:none;margin-bottom:8px">'
    +'<button id="gps-drop" style="width:100%;padding:9px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:8px;color:#ef4444;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">&#x1F4CD; Use My Current GPS Location</button>'
    +'<div id="gps-drop-st" style="font-size:11px;color:rgba(255,255,255,.35);text-align:center;margin-top:4px"></div></div>'
    +'<div style="background:rgba(16,185,129,.05);border:1.5px solid rgba(16,185,129,.15);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><div style="font-size:12px;color:rgba(255,255,255,.4)">Delivery fee</div><div id="fare-sub" style="font-size:11px;color:rgba(255,255,255,.3);margin-top:2px">~KSh 50 base + distance</div></div>'
    +'<div id="fared" style="font-size:28px;font-weight:800;color:#10b981">~KSh '+estDf+'</div></div>'
    +'<button id="reqb" class="btn bg" style="font-size:16px;padding:17px">&#x1F6F5; Request Rider Now</button>'
    +'</div>';
  function updateFare(){
    var km=1;
    if(window._gpsLat&&window._gpsLng&&window._dropLat&&window._dropLng){km=Math.max(0.2,Math.round(haversineKm(window._gpsLat,window._gpsLng,window._dropLat,window._dropLng)*10)/10);}
    var fee=calcFee(km);
    var fd=document.getElementById('fared');if(fd)fd.textContent='KSh '+fee;
    var fs=document.getElementById('fare-sub');if(fs)fs.textContent='~'+km+'km × KSh '+(window._ADMIN_PER_KM||20)+' + base';
    window._finalDf=fee;
  }
  document.getElementById('gps-pick').addEventListener('click',function(){
    var btn=this;btn.disabled=true;btn.textContent='Getting location...';
    getGPSRobust(function(la,ln,acc){window._gpsLat=la;window._gpsLng=ln;var f=document.getElementById('pfr');if(f&&!f.value)f.value='My GPS Location (±'+acc+'m)';btn.disabled=false;btn.textContent='GPS captured';updateFare();},function(msg){btn.disabled=false;btn.textContent='Use GPS';var st=document.getElementById('gps-pick-st');if(st)st.textContent=msg||'GPS failed';},document.getElementById('gps-pick-st'));
  });
  document.getElementById('gps-drop').addEventListener('click',function(){
    var btn=this;btn.disabled=true;btn.textContent='Getting location...';
    getGPSRobust(function(la,ln,acc){window._dropLat=la;window._dropLng=ln;var f=document.getElementById('pto');if(f&&!f.value)f.value='Drop-off GPS (±'+acc+'m)';btn.disabled=false;btn.textContent='GPS captured';updateFare();},function(msg){btn.disabled=false;btn.textContent='Use GPS';var st=document.getElementById('gps-drop-st');if(st)st.textContent=msg||'GPS failed';},document.getElementById('gps-drop-st'));
  });
  document.getElementById('reqb').addEventListener('click',function(){
    var from=(document.getElementById('pfr').value||'').trim();var to=(document.getElementById('pto').value||'').trim();
    if(!from){toast('Enter pickup location');return;}if(!to){toast('Enter drop-off location');return;}
    var btn=this;btn.textContent='Requesting...';btn.disabled=true;
    var df=window._finalDf||calcFee(1);
    var orderData={type:'pickup',customer_phone:USER.phone,customer_name:USER.name,pickup_from:from,delivery_address:to,item_description:'Pickup: '+from+' to '+to,distance:1,delivery_fee:df,total:df,rider_earnings:df,platform_earnings:0,status:'confirmed',rider_phone:null,rider_name:null};
    if(window._gpsLat){orderData.pickup_lat=window._gpsLat;orderData.pickup_lng=window._gpsLng;}
    if(window._dropLat){orderData.delivery_lat=window._dropLat;orderData.delivery_lng=window._dropLng;}
    loadFB(function(db){
      if(!db){btn.textContent='Request Rider Now';btn.disabled=false;toast('No connection');return;}
      db.collection('delivery_orders').add(Object.assign({},orderData,{ts:firebase.firestore.FieldValue.serverTimestamp()}))
        .then(function(){toast('Rider requested! KSh '+df+' · Track in My Orders');showOrds();})
        .catch(function(){btn.textContent='Request Rider Now';btn.disabled=false;toast('Error — try again');});
    });
  });
}

function showItemAcceptModal(order){
  var items=order.items||[];
  var h='<div class="hd"></div>';
  h+='<div style="font-size:18px;font-weight:800;margin-bottom:2px">Review Items</div>';
  h+='<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:4px">&#x1F464; '+(order.customer_name||'Customer')+' · &#x1F4CD; '+(order.delivery_address||'')+'</div>';
  h+='<div style="font-size:12px;color:rgba(255,255,255,.35);margin-bottom:14px">Tick items you have. Untick out-of-stock items. Then Submit.</div>';
  h+='<div id="item-accept-list">';
  items.forEach(function(it,i){
    h+='<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06)">';
    h+='<div id="itog-'+i+'" class="item-tog" data-idx="'+i+'" style="width:36px;height:36px;border-radius:50%;background:rgba(16,185,129,.15);border:2px solid #10b981;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0">&#x2713;</div>';
    h+='<div style="flex:1"><div style="font-weight:700;font-size:14px">'+(it.name||'Item')+'</div><div style="font-size:12px;color:rgba(255,255,255,.4)">x'+(it.quantity||1)+' · KSh '+((it.price||0)*(it.quantity||1))+'</div></div>';
    h+='<div style="font-size:16px;font-weight:800;color:#10b981">KSh '+((it.price||0)*(it.quantity||1))+'</div>';
    h+='</div>';
  });
  h+='</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:4px"><div><div style="font-size:11px;color:rgba(255,255,255,.4)">Accepted subtotal</div><div id="itotal" style="font-size:20px;font-weight:800;color:#10b981">KSh 0</div></div><div id="icount" style="font-size:12px;color:rgba(255,255,255,.4)">'+items.length+'/'+items.length+' items</div></div>';
  h+='<button id="submit-accept" class="btn bg" style="font-size:15px;padding:15px">&#x2705; Submit — Notify Customer to Pay</button>';
  h+='<button id="reject-all" class="btn br" style="margin-top:6px">&#x274C; Reject Whole Order</button>';
  showSh(h);
  var accepted=items.map(function(){return true;});
  function recalc(){var total=0;var count=0;accepted.forEach(function(a,i){if(a){total+=(items[i].price||0)*(items[i].quantity||1);count++;}});var tot=document.getElementById('itotal');if(tot)tot.textContent='KSh '+total;var cnt=document.getElementById('icount');if(cnt)cnt.textContent=count+'/'+items.length+' items';return{total:total,count:count};}
  recalc();
  document.getElementById('item-accept-list').querySelectorAll('.item-tog').forEach(function(tog){
    tog.addEventListener('click',function(){var i=parseInt(this.getAttribute('data-idx'));accepted[i]=!accepted[i];if(accepted[i]){this.style.background='rgba(16,185,129,.15)';this.style.borderColor='#10b981';this.innerHTML='&#x2713;';}else{this.style.background='rgba(239,68,68,.1)';this.style.borderColor='#ef4444';this.innerHTML='&#x2715;';}recalc();});
  });
  document.getElementById('submit-accept').addEventListener('click',function(){
    var r=recalc();if(r.count===0){toast('Accept at least one item');return;}
    var btn=this;btn.textContent='Submitting...';btn.disabled=true;
    var acceptedItems=items.filter(function(it,i){return accepted[i];});
    var newSub=acceptedItems.reduce(function(s,it){return s+(it.price||0)*(it.quantity||1);},0);
    var df=order.delivery_fee||70;
    loadFB(function(db){
      if(!db){btn.textContent='Submit';btn.disabled=false;toast('No connection');return;}
      db.collection('shops').doc(USER.phone).get().then(function(snap){
        var shopTill=(snap.exists&&snap.data().mpesa_till)||USER.phone;
        db.collection('delivery_orders').doc(order.id).update({status:'shop_accepted',accepted_items:acceptedItems,subtotal:newSub,total:newSub+df,shop_accepted_at:Date.now(),shop_phone:USER.phone,shop_mpesa:shopTill})
          .then(function(){hideSh();toast('Customer notified to pay KSh '+newSub+' via M-Pesa');})
          .catch(function(){btn.textContent='Submit';btn.disabled=false;toast('Error');});
      }).catch(function(){btn.textContent='Submit';btn.disabled=false;toast('Error');});
    });
  });
  document.getElementById('reject-all').addEventListener('click',function(){if(!confirm('Reject this order?'))return;hideSh();dbUpd('delivery_orders',order.id,{status:'rejected'},function(){toast('Order rejected');});});
}

function getOfflineQueue(){try{return JSON.parse(localStorage.getItem('tumana_oq_'+(USER&&USER.phone||'anon'))||'[]');}catch(e){return[];}}
function saveOfflineQueue(q){try{localStorage.setItem('tumana_oq_'+(USER&&USER.phone||'anon'),JSON.stringify(q));}catch(e){}}
function queueOfflineAction(type,data){
  var q=getOfflineQueue();
  q.push({id:'oq'+Date.now(),type:type,data:data,ts:Date.now()});
  saveOfflineQueue(q);
}
function syncOfflineQueue(){
  var q=getOfflineQueue();
  if(!q.length)return;
  loadFB(function(db){
    if(!db)return;
    var remaining=[];
    var done=0;
    q.forEach(function(item){
      try{
        if(item.type==='stock_update'){
          db.collection('shops').doc(USER.phone).collection('stock').doc(item.data.id)
            .set(item.data.fields,{merge:true})
            .then(function(){done++;if(done+remaining.length===q.length)saveOfflineQueue(remaining);})
            .catch(function(){remaining.push(item);});
        } else if(item.type==='sale'){
          db.collection('shops').doc(USER.phone).collection('sales')
            .add(item.data)
            .then(function(){done++;if(done+remaining.length===q.length)saveOfflineQueue(remaining);})
            .catch(function(){remaining.push(item);});
        } else if(item.type==='order_update'){
          db.collection('delivery_orders').doc(item.data.id)
            .update(item.data.fields)
            .then(function(){done++;if(done+remaining.length===q.length)saveOfflineQueue(remaining);})
            .catch(function(){remaining.push(item);});
        } else {
          done++; // Unknown type — drop it
        }
      }catch(e){remaining.push(item);}
    });
    if(q.length===0)saveOfflineQueue([]);
  });
}

// ── Robust GPS with retry + save to Firestore ─────────────────────────
function getGPSRobust(onSuccess,onFail,statusEl){
  function setS(msg,col){if(statusEl){statusEl.textContent=msg;if(col)statusEl.style.color=col;}}
  setS('Getting location...','rgba(255,255,255,.5)');
  // 1. Try cached location first (instant)
  try{
    var g=JSON.parse(localStorage.getItem('tumana_gps')||'null');
    if(g&&g.ts&&Date.now()-g.ts<1800000){
      window._custLat=g.lat;window._custLng=g.lng;
      setS('Using saved location ('+Math.round((Date.now()-g.ts)/60000)+'min ago)','#f59e0b');
      onSuccess(g.lat,g.lng,500);
      // Refresh silently in background
      if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){saveG(p.coords.latitude,p.coords.longitude);},function(){},{enableHighAccuracy:false,timeout:15000,maximumAge:0});
      return;
    }
  }catch(e){}
  if(!navigator.geolocation){setS('Location not supported on this device','#ef4444');if(onFail)onFail('not supported');return;}
  // 2. Low accuracy first (network-based, fast, works in AppGeyser)
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
    setS('Location found (±'+acc+'m)','#10b981');
    saveG(lat,lng);onSuccess(lat,lng,acc);
  },function(err){
    // 3. Retry with longer timeout
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
      setS('Location found (±'+acc+'m)','#10b981');
      saveG(lat,lng);onSuccess(lat,lng,acc);
    },function(err2){
      var msg=err2.code===1?'Location permission denied. Open browser Settings and allow Location.':'Type your address manually above — location unavailable';
      setS(msg,'#ef4444');if(onFail)onFail(msg);
    },{enableHighAccuracy:false,timeout:25000,maximumAge:120000});
  },{enableHighAccuracy:false,timeout:12000,maximumAge:60000});
  function saveG(lat,lng){
    window._custLat=lat;window._custLng=lng;
    try{localStorage.setItem('tumana_gps',JSON.stringify({lat:lat,lng:lng,ts:Date.now()}));}catch(e){}
    if(USER&&USER.phone){loadFB(function(db){if(!db)return;var col=USER.role==='rider'?'riders':'tumana_users';db.collection(col).doc(USER.role==='rider'?USER.phone:USER.phone+'_'+USER.role).set({lat:lat,lng:lng,gps_at:Date.now()},{merge:true}).catch(function(){});});}
  }
}
function getLocalSales(){try{return JSON.parse(localStorage.getItem('tumana_sales_'+USER.phone)||'[]');}catch(e){return[];}}
function saveLocalSale(sale){
  var arr=getLocalSales();
  sale.id=sale.id||('ls'+Date.now());
  sale.synced=false;
  arr.unshift(sale);
  if(arr.length>500)arr=arr.slice(0,500);
  localStorage.setItem('tumana_sales_'+USER.phone,JSON.stringify(arr));
  return sale;
}
function markSaleSynced(localId){
  var arr=getLocalSales();
  arr.forEach(function(s){if(s.id===localId)s.synced=true;});
  localStorage.setItem('tumana_sales_'+USER.phone,JSON.stringify(arr));
}
function syncLocalSales(){
  var arr=getLocalSales();
  var unsynced=arr.filter(function(s){return !s.synced;});
  if(!unsynced.length)return;
  loadFB(function(db){
    if(!db)return;
    unsynced.forEach(function(s){
      db.collection('shops').doc(USER.phone).collection('sales').add(s)
        .then(function(){markSaleSynced(s.id);})
        .catch(function(){});
    });
  });
}

function showSDebts(el){
  el.innerHTML='<div style="text-align:center;padding:30px"><div class="spin" style="margin:0 auto"></div></div>';
  // Combine local + Firestore debts
  var localDebts=getLocalSales().filter(function(s){return s.is_debt&&s.payment_method==='debt';});
  loadFB(function(db){
    if(!db){
      renderDebts(localDebts,el);return;
    }
    db.collection('shops').doc(USER.phone).collection('sales').where('is_debt','==',true).orderBy?
    db.collection('shops').doc(USER.phone).collection('sales').where('is_debt','==',true).limit(100).get()
      .then(function(snap){
        var remote=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        // Merge local unsynced + remote
        var localOnly=localDebts.filter(function(l){return !l.synced;});
        renderDebts(localOnly.concat(remote),el);
      }).catch(function(){renderDebts(localDebts,el);}):renderDebts(localDebts,el);
  });
}

function showSHistory(el){
  el.innerHTML='<div style="text-align:center;padding:30px"><div class="spin" style="margin:0 auto"></div></div>';
  // Show local sales first (instant), then load Firestore
  var local=getLocalSales().filter(function(s){return !s.is_debt;});
  loadFB(function(db){
    if(!db){renderSHistory(local,el);return;}
    db.collection('shops').doc(USER.phone).collection('sales').limit(200).get()
      .then(function(snap){
        var remote=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        // Merge, deduplicate
        var localUnsynced=local.filter(function(l){return !l.synced;});
        var all=localUnsynced.concat(remote).sort(function(a,b){return(b.created_at||0)-(a.created_at||0);});
        renderSHistory(all,el);
        // Sync unsynced in background
        syncLocalSales();
      }).catch(function(){renderSHistory(local,el);});
  });
}
function renderSHistory(all,el){
  if(!all.length){el.innerHTML=empty('&#x1F4C5;','No sales yet','Record your first sale above');return;}
  // Group by day
  var today=new Date().toDateString();
  var yesterday=new Date(Date.now()-86400000).toDateString();
  var groups={};
  all.forEach(function(s){
    var d=new Date(s.created_at||0).toDateString();
    if(!groups[d])groups[d]={sales:[],total:0,profit:0};
    groups[d].sales.push(s);groups[d].total+=s.total||0;groups[d].profit+=(s.profit||0);
  });
  var h='';
  Object.keys(groups).sort(function(a,b){return new Date(b)-new Date(a);}).slice(0,14).forEach(function(day){
    var g=groups[day];
    var label=day===today?'Today':day===yesterday?'Yesterday':new Date(day).toLocaleDateString('en-KE',{weekday:'short',month:'short',day:'numeric'});
    h+='<div style="margin-bottom:14px">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
    h+='<div style="font-size:11px;font-weight:800;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px">'+label+'</div>';
    h+='<div style="text-align:right"><span style="font-weight:800;color:#10b981">KSh '+g.total+'</span><span style="font-size:10px;color:#4ade80;margin-left:6px">+'+g.profit+' profit</span></div>';
    h+='</div>';
    g.sales.forEach(function(s){
      h+='<div class="card" style="margin-bottom:6px;padding:10px">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center">';
      h+='<div><div style="font-size:13px;font-weight:700">'+(s.product_name||'Sale')+'</div>';
      h+='<div style="font-size:11px;color:rgba(255,255,255,.4)">'+(s.customer_name||'Walk-in')+' · '+(s.payment_method==='cash'?'Cash':s.payment_method==='mpesa'?'M-Pesa':'Debt');
      if(!s.synced)h+=' · <span style="color:#f59e0b">⏳ Pending sync</span>';
      h+='</div></div>';
      h+='<div style="text-align:right"><div style="font-weight:800;color:#10b981">KSh '+(s.total||0)+'</div>';
      if(s.profit)h+='<div style="font-size:10px;color:#4ade80">+'+s.profit+'</div>';
      h+='</div></div></div>';
    });
    h+='</div>';
  });
  el.innerHTML=h;
}

function showSInsights(){
  var el=document.getElementById('shc');if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:40px"><div class="spin" style="margin:0 auto"></div></div>';
  loadFB(function(db){
    if(!db){el.innerHTML='<div style="text-align:center;padding:30px;color:rgba(255,255,255,.4)">Connect to view insights</div>';return;}
    Promise.all([
      db.collection('shops').doc(USER.phone).collection('sales').limit(500).get(),
      db.collection('shops').doc(USER.phone).collection('stock').get()
    ]).then(function(res){
      var allS=res[0].docs.map(function(d){return Object.assign({id:d.id},d.data());});
      var stock=res[1].docs.map(function(d){return Object.assign({id:d.id},d.data());});
      var paid=allS.filter(function(x){return !x.is_debt;});
      var today=new Date().toDateString();
      var todayS=paid.filter(function(x){return new Date(x.created_at||0).toDateString()===today;});
      var todayRev=todayS.reduce(function(s,x){return s+(x.total||0);},0);
      var todayCost=todayS.reduce(function(s,x){return s+(x.cost||0);},0);
      var allRev=paid.reduce(function(s,x){return s+(x.total||0);},0);
      var allCost=paid.reduce(function(s,x){return s+(x.cost||0);},0);
      var stockSell=stock.reduce(function(s,i){return s+(i.selling_price||0)*(i.quantity||0);},0);
      var stockCost=stock.reduce(function(s,i){return s+(i.cost_price||0)*(i.quantity||0);},0);
      var prods={};
      paid.forEach(function(x){var n=x.product_name||'Unknown';if(!prods[n])prods[n]={rev:0,count:0,profit:0};prods[n].rev+=(x.total||0);prods[n].count++;prods[n].profit+=(x.total||0)-(x.cost||0);});
      var topProds=Object.keys(prods).map(function(k){return{name:k,data:prods[k]};}).sort(function(a,b){return b.data.count-a.data.count;});
      var lowStock=stock.filter(function(i){return(i.quantity||0)>0&&(i.quantity||0)<=5;}).sort(function(a,b){return(a.quantity||0)-(b.quantity||0);});
      var outOfStock=stock.filter(function(i){return(i.quantity||0)===0;});
      var days7=[];
      for(var di=6;di>=0;di--){var dd=new Date();dd.setDate(dd.getDate()-di);days7.push({label:dd.toLocaleDateString('en-KE',{weekday:'short',day:'numeric'}),date:dd.toDateString(),rev:0});}

      h+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)"><span style="color:rgba(255,255,255,.4);font-size:13px">Cost value</span><span style="font-weight:700;color:rgba(255,255,255,.6)">KSh '+stockCost.toLocaleString()+'</span></div>';
      h+='<div style="display:flex;justify-content:space-between;padding:6px 0"><span style="color:rgba(255,255,255,.4);font-size:13px">Potential profit</span><span style="font-weight:800;color:#4ade80">KSh '+(stockSell-stockCost).toLocaleString()+'</span></div></div>';
      h+='<div class="sbox" style="margin-bottom:10px"><div class="sboxt">&#x1F4CA; Last 7 Days Sales</div>';
      h+='<div style="display:flex;align-items:flex-end;gap:3px;height:90px;margin-bottom:8px">';
      days7.forEach(function(d){
        var pct=d.rev>0?Math.max(8,Math.round(d.rev/maxRev*100)):4;
        var isToday=d.date===today;
        h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">';
        h+='<div style="font-size:8px;color:rgba(255,255,255,.45);font-weight:700;text-align:center">'+(d.rev>0?d.rev:'')+'</div>';

          h+='</div></div>';
        });
        h+='</div>';
      }
      if(lowStock.length||outOfStock.length){

        }

function startJL(){
  if(RUNSUB){RUNSUB();RUNSUB=null;}
  if(!RACT){
    dbSet('riders',USER.phone,{busy:false,online:true,name:USER.name,phone:USER.phone});
    // Capture GPS when going online — saved to Firestore for proximity matching
    getGPSRobust(function(lat,lng){
      loadFB(function(db){
        if(db)db.collection('riders').doc(USER.phone).set({lat:lat,lng:lng,gps_at:Date.now()},{merge:true}).catch(function(){});
      });
    },function(){},null); // silent fail — still goes online
  }
  var prevJobCount=RJOBS.length;
  RUNSUB=dbListenIn('delivery_orders','status',['confirmed'],function(jobs){
    var newJobs=RACT?[]:jobs.filter(function(j){return !j.rider_phone;});
    
    if(!RACT && newJobs.length > prevJobCount){
      
      if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
      
      try{
        var ctx=new(window.AudioContext||window.webkitAudioContext)();
        [0,0.3,0.6].forEach(function(t){
          var o=ctx.createOscillator();
          var g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=880;
          g.gain.setValueAtTime(0.4,ctx.currentTime+t);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.25);
          o.start(ctx.currentTime+t);
          o.stop(ctx.currentTime+t+0.25);
        });
      }catch(e){}
      
      var jcnt=document.getElementById('jcnt');
      if(jcnt){jcnt.style.animation='none';
        setTimeout(function(){jcnt.style.color='#ef4444';jcnt.style.transform='scale(1.4)';},10);
        setTimeout(function(){jcnt.style.color='#8b5cf6';jcnt.style.transform='';},800);
      }
    }
    prevJobCount=newJobs.length;
    RJOBS=newJobs;
    var cnt=document.getElementById('jcnt');if(cnt)cnt.textContent=RACT?0:RJOBS.length;
    var lbl=document.getElementById('jcnt-lbl');if(lbl)lbl.textContent=RACT?'ON DELIVERY':'AVAILABLE';
    renderRBody();
  });
}

function accJob(jobId){
  
  if(RACT){
    toast('Complete your current delivery first');
    return;
  }
  var job=null;RJOBS.forEach(function(j){if(j.id===jobId)job=j;});if(!job)return;
  var rMpesaToSave=USER.mpesa_phone||window._riderMpesa||'';
  dbUpd('delivery_orders',jobId,{rider_phone:USER.phone,rider_name:USER.name,rider_mpesa:rMpesaToSave,status:'assigned'},function(ok){
    if(!ok){toast('Error accepting - try again');return;}

    dbSet('riders',USER.phone,{busy:true,online:true,name:USER.name,phone:USER.phone});
    RACT=Object.assign({},job,{status:'assigned',rider_phone:USER.phone,rider_name:USER.name});
    RJOBS=[]; 
    toast('Accepted! Head to '+(job.type==='pickup'?job.pickup_from:job.shopName||'the shop'));

    if(window._ractUnsub)window._ractUnsub();
    loadFB(function(db){
      window._ractUnsub=db.collection('delivery_orders').doc(RACT.id).onSnapshot(function(doc){
        if(!doc.exists||!RACT||doc.id!==RACT.id)return;
        var d=doc.data();
        if(d.status==='confirmed'||d.status==='rejected'){
          
          RACT=null;if(window._ractUnsub){window._ractUnsub();window._ractUnsub=null;}
          dbSet('riders',USER.phone,{busy:false});
          toast('Order was reset or cancelled by shop/admin');
          if(RON)startJL();
          renderRBody();
        }
      });
    });
    renderRBody();
  });
}
function advJob(){
  if(!RACT)return;
  var ns=NST[RACT.status];

  if(!ns){
    showCollectPayment(RACT);
    return;
  }
  
  if(ns==='delivered'){
    showCollectPayment(RACT);

function completeDelivery(order,riderEarn,payMethod,mpesaCode){
  if(!order||!order.id){toast('Error: order data missing. Tap Back and try again.');return;}
  
  var btn=document.getElementById('confirm-cash-pay')||document.getElementById('confirm-mpesa-pay');
  if(btn){btn.textContent='Completing...';btn.disabled=true;}

  if(window._ractUnsub){try{window._ractUnsub();}catch(e){}window._ractUnsub=null;}

  var cutPct=window._RIDER_CUT||0;
  var platformCut=cutPct>0?Math.round(riderEarn*cutPct/100):0;
  var riderNet=riderEarn-platformCut; // = riderEarn when cut is 0%
  var updateData={
    status:'delivered',
    rider_payment_method:payMethod,
    rider_mpesa_code:mpesaCode||'',
    delivered_at:Date.now(),
    platform_cut:platformCut,
    rider_net_earnings:riderNet
  };

  loadFB(function(db){
    if(!db){
      if(btn){btn.textContent='No connection — tap again';btn.disabled=false;}
      toast('No connection. Check your data and try again.');
      return;
    }
    db.collection('delivery_orders').doc(order.id).update(updateData)
      .then(function(){
        
        db.collection('riders').doc(USER.phone).set({
          total_earnings:firebase.firestore.FieldValue.increment(riderEarn),
          orders_completed:firebase.firestore.FieldValue.increment(1),
          pending_payout:firebase.firestore.FieldValue.increment(riderEarn),
          busy:false
        },{merge:true}).catch(function(){});

        REARN=(REARN||0)+riderEarn;
        RACT=null;
        hideSh();
        toast('Delivery complete! KSh '+riderEarn+' earned');
        
        if(RON)startJL();
        renderRBody();
      })
      .catch(function(e){
        console.error('completeDelivery error:',e);
        if(btn){btn.textContent='Error — tap to retry';btn.disabled=false;}
        toast('Error completing delivery: '+(e.message||'check connection')+'  — tap button again');
      });
  });
}

  var filters={
    all:function(o){return true;},
    pending:function(o){return o.status==='placed';},
    active:function(o){return['confirmed','assigned','heading','picked','transit'].indexOf(o.status)>=0;},
    done:function(o){return o.status==='delivered';}
  };
  function setActive(key){
    ['all','pend','active','done'].forEach(function(k){
      var btn=document.getElementById('ord-'+k);if(!btn)return;
      var match=(k==='pend'?'pending':k)===key;
      btn.className=match?'btn bg':'btn bo';
    });
  }
  function renderOrds(list){
    var ab=document.getElementById('ab');if(!ab)return;

    ab.innerHTML=list.map(function(o){
      return '<div class="card" style="margin-bottom:10px;border-left:3px solid '+(o.status==='delivered'?'#10b981':o.status==='placed'?'#f59e0b':o.status==='rejected'?'#ef4444':'#8b5cf6')+'">'

        +(o.status==='placed'?'<button class="ord-confirm btn bg" data-id="'+o.id+'" style="margin-top:4px;font-size:11px;padding:7px">&#x2705; Force Confirm (Admin)</button>':'')
        +'</div>';
    }).join('');
  }
  dbAll('delivery_orders',function(orders){
    allOrds=orders.sort(function(a,b){return(b.ts&&b.ts.seconds||0)-(a.ts&&a.ts.seconds||0);});
    renderOrdsAndWire(allOrds.filter(filters[f]));
    var pendCount=allOrds.filter(filters.pending).length;
    if(pendCount&&document.getElementById('ord-pend')){
      document.getElementById('ord-pend').textContent='Pending ('+pendCount+')';
    }
  });
  function wireOrdButtons(){
    document.getElementById('ab').querySelectorAll('.ord-reset').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Reset this order? The current rider will be removed and order re-opens for any rider.'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({
            status:'confirmed',rider_phone:null,rider_name:null,assigned_at:null
          }).then(function(){toast('&#x2705; Order reset — available for riders');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error resetting order');});
        });
      });
    });
    document.getElementById('ab').querySelectorAll('.ord-rej').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Reject this order?'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({status:'rejected'})
          .then(function(){toast('Order rejected');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error');});
        });
      });
    });
    document.getElementById('ab').querySelectorAll('.ord-confirm').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Force confirm this order? Riders will be notified.'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({status:'confirmed'})
          .then(function(){toast('&#x2705; Order confirmed — riders notified');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error');});
        });
      });
    });
  }

  function renderOrdsAndWire(list){renderOrds(list);wireOrdButtons();}

  document.getElementById('ord-all').addEventListener('click',function(){setActive('all');renderOrdsAndWire(allOrds.filter(filters.all));});
  document.getElementById('ord-pend').addEventListener('click',function(){setActive('pending');renderOrdsAndWire(allOrds.filter(filters.pending));});
  document.getElementById('ord-active').addEventListener('click',function(){setActive('active');renderOrdsAndWire(allOrds.filter(filters.active));});

}

  });

function renderCurrentView(){
  if(USER){
    if(USER.role==='customer')showHome();
    else if(USER.role==='rider'){
    
    var rMpesa=USER.mpesa_phone||window._riderMpesa||'';
    if(!rMpesa||rMpesa.length<9){
      
      loadFB(function(db){
        if(!db){showRiderMpesaPrompt();return;}
        db.collection('riders').doc(USER.phone).get().then(function(doc){
          var saved=doc.exists&&doc.data().mpesa_phone||'';
          if(saved&&saved.length>=9){
            window._riderMpesa=saved;USER.mpesa_phone=saved;su();
          } else {
            showRiderMpesaPrompt();
          }
        }).catch(function(){showRiderMpesaPrompt();});
      });
    }

    loadFB(function(db){
      if(!db){showJobs();return;}
      db.collection('delivery_orders')
        .where('rider_phone','==',USER.phone)
        .where('status','in',['assigned','picked'])
        .limit(1)
        .get()
        .then(function(snap){
          if(!snap.empty){
            var d=snap.docs[0];
            RACT=Object.assign({id:d.id},d.data());
            
            var statusMap={'heading':'assigned','picked':'picked','transit':'picked','assigned':'assigned'};
            if(statusMap[RACT.status])RACT.status=statusMap[RACT.status];
            else if(['assigned','picked'].indexOf(RACT.status)<0)RACT.status='picked';
            dbSet('riders',USER.phone,{busy:true,online:true,name:USER.name,phone:USER.phone});
            console.log('Restored RACT:',RACT.id,'status:',RACT.status);
          }
          showJobs();
        })
        .catch(function(){showJobs();});
    });
  }
    else if(USER.role==='shop')renderShopDash();
    else if(USER.role==='admin')showAOv();
  } else {showRole();}
}
