.qb-p{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.divider{display:flex;align-items:center;gap:10px;margin:12px 0;color:rgba(255,255,255,.2);font-size:11px}

// Theme color helpers - used throughout all innerHTML
function tc(){return curTheme==='light'?'#0d2818':'#ffffff';}
function tc2(){return curTheme==='light'?'rgba(13,40,24,.55)':'rgba(255,255,255,.45)';}

function calcFee(km){return Math.round(50+(parseFloat(km)||0.5)*20);}

function loadFB(cb){
  if(_db){cb(_db);return;}
  _fbQ.push(cb);
  if(_fbLoad)return;
  _fbLoad=true;
  function ls(src,next){var s=document.createElement('script');s.src=src;s.onload=next;s.onerror=function(){_fbQ.forEach(function(f){f(null);});_fbQ=[];};document.head.appendChild(s);}
  ls('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',function(){
    ls('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js',function(){
      try{if(!firebase.apps.length)firebase.initializeApp(FBCFG);_db=firebase.firestore();}catch(e){_db=null;}
      _fbQ.forEach(function(f){f(_db);});_fbQ=[];
    });
  });
}

function dbGet(col,id,cb){loadFB(function(db){if(!db)return cb(null);db.collection(col).doc(id).get().then(function(d){cb(d.exists?Object.assign({id:d.id},d.data()):null);}).catch(function(){cb(null);});});}
function dbSet(col,id,data){loadFB(function(db){if(!db)return;db.collection(col).doc(id).set(data,{merge:true}).catch(function(){});});}
function dbAdd(col,data,cb){loadFB(function(db){if(!db){if(cb)cb({id:'local_'+Date.now()});return;}var ts=null;try{ts=firebase.firestore.FieldValue.serverTimestamp();}catch(e){}db.collection(col).add(Object.assign({},data,{created_at:ts})).then(function(r){if(cb)cb(r);}).catch(function(){if(cb)cb({id:'local_'+Date.now()});});});}
function dbUpdate(col,id,data,cb){loadFB(function(db){if(!db){if(cb)cb(false);return;}db.collection(col).doc(id).update(data).then(function(){if(cb)cb(true);}).catch(function(){if(cb)cb(false);});});}
function dbListen(col,field,op,val,cb){loadFB(function(db){if(!db){cb([]);return null;}var u=db.collection(col).where(field,op,val).limit(50).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){cb([]);});return u;});}
function dbListenIn(col,field,vals,cb){loadFB(function(db){if(!db){cb([]);return null;}var u=db.collection(col).where(field,'in',vals).limit(30).onSnapshot(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},function(){cb([]);});return u;});}
function dbAll(col,cb){loadFB(function(db){if(!db){cb([]);return;}db.collection(col).get().then(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){cb([]);});});}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(_tt);_tt=setTimeout(function(){t.style.display='none';},2800);}
function pg(){return document.getElementById('pg');}
function showSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('overlay').classList.add('show');}
function hideSheet(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').onclick=function(e){if(e.target===document.getElementById('overlay'))hideSheet();};

var THEMES=['dark','light','green'];
var TCOLORS={dark:'#08080c',light:'#f0faf5',green:'#041209'};
var TCARD={dark:'#111116',light:'#ffffff',green:'#082016'};
var TTXT={dark:'#ffffff',light:'#0d2818',green:'#e8fdf2'};
var TTXT2={dark:'rgba(255,255,255,.45)',light:'rgba(13,40,24,.6)',green:'rgba(200,255,220,.6)'};
var TNAV={dark:'#000000',light:'#ffffff',green:'#030f08'};
var TSB={dark:'#000000',light:'#059669',green:'#030f08'};

function applyTheme(){
  var bg=TCOLORS[curTheme];
  var nav=TNAV[curTheme];
  var sb=TSB[curTheme];
  var txt=TTXT[curTheme];
  document.body.style.background=bg;
  document.body.style.color=txt;
  var wrap=document.getElementById('wrap');
  if(wrap)wrap.style.background=bg;
  var sbEl=document.getElementById('sb');
  if(sbEl){sbEl.style.background=sb;sbEl.style.color='rgba(255,255,255,.9)';}
  var navEl=document.getElementById('nav');
  if(navEl){navEl.style.background=nav;navEl.style.borderTop=curTheme==='light'?'1px solid #d1fae5':'1px solid rgba(255,255,255,.08)';}
  var pgEl=document.getElementById('pg');
  if(pgEl){pgEl.style.background=bg;pgEl.style.color=txt;}
  document.getElementById('theme-btn').textContent=curTheme==='dark'?'☀️':curTheme==='light'?'🌿':'🌙';
  // Inject light mode CSS if needed
  var existingStyle=document.getElementById('theme-style');
  if(existingStyle)existingStyle.remove();
  if(curTheme==='light'){
    var s=document.createElement('style');s.id='theme-style';
    s.textContent='.card{background:#ffffff!important;border-color:#d1fae5!important;color:#0d2818!important;box-shadow:0 2px 8px rgba(16,185,129,.08)!important}'
      +'.stat-box{background:#ecfdf5!important;border-color:#a7f3d0!important;color:#0d2818!important}'
      +'.stat-l{color:rgba(13,40,24,.55)!important}'
      +'.chip-d{background:#ecfdf5!important;border-color:#a7f3d0!important;color:#065f46!important}'
      +'.sbox{background:#ffffff!important;border-color:#d1fae5!important}'
      +'.sbox-t{color:rgba(13,40,24,.55)!important}'
      +'.spin{border-color:rgba(16,185,129,.2)!important;border-top-color:#10b981!important}'
      +'.empty .et{color:#0d2818!important}'
      +'.empty .es{color:rgba(13,40,24,.5)!important}'
      +'.fld input,.fld select,.fld textarea{background:#ecfdf5!important;border-color:#a7f3d0!important;color:#0d2818!important}'
      +'.fld label{color:rgba(13,40,24,.6)!important}'
      +'.btn-o{background:transparent!important;border-color:#10b981!important;color:#059669!important}'
      +'.divider{color:rgba(13,40,24,.3)!important}'
      +'.overlay .sheet{background:#ffffff!important;border-color:#10b981!important}'
      +'.handle{background:rgba(16,185,129,.3)!important}'
      +'.fare-card{background:#ecfdf5!important;border-color:#a7f3d0!important;color:#0d2818!important}'
      +'.fare-card.sel{background:#d1fae5!important;border-color:#10b981!important}'
      +'.pc{background:#ffffff!important;border-color:#d1fae5!important}'
      +'.pn{color:#0d2818!important}'
      +'.tog{background:#aaa!important}'+'body.light [style*="rgba(255,255,255,.4)"]{color:rgba(13,40,24,.55)!important}'+'.sbox div[style]{color:rgba(13,40,24,.65)!important}'
      +'.tog.on{background:#10b981!important}';
    document.head.appendChild(s);
  } else if(curTheme==='green'){
    var s2=document.createElement('style');s2.id='theme-style';
    s2.textContent='.card{background:#082016!important;border-color:rgba(16,185,129,.2)!important}'
      +'.stat-box{background:#0b2c1e!important;border-color:rgba(16,185,129,.2)!important}'
      +'.sbox{background:#082016!important;border-color:rgba(16,185,129,.2)!important}'
      +'.fld input,.fld select,.fld textarea{background:#0b2c1e!important;border-color:rgba(16,185,129,.3)!important;color:#e8fdf2!important}';
    document.head.appendChild(s2);
  }
}
function toggleTheme(){
  var idx=(THEMES.indexOf(curTheme)+1)%THEMES.length;
  curTheme=THEMES[idx];
  localStorage.setItem('tumana_theme',curTheme);
  applyTheme();
  toast('Theme: '+curTheme.charAt(0).toUpperCase()+curTheme.slice(1));
}

function setTitle(t,c){var el=document.getElementById('sb-title');if(el){el.textContent=t;el.style.color=c||'#10b981';}}

function setNav(role,tab){
  var nav=document.getElementById('nav');
  nav.style.display='block';
  nav.style.background=TNAV[curTheme];nav.style.color=curTheme==='light'?'#333':'#fff';nav.style.borderTop=curTheme==='light'?'1px solid #e5e7eb':'1px solid rgba(255,255,255,.08)';
  nav.style.borderTop=curTheme==='light'?'1px solid #ddd':'1px solid rgba(128,128,128,.2)';
  var ACT={customer:'#10b981',rider:'#8b5cf6',shop:'#f59e0b',admin:'#8b5cf6'};
  var actColor=ACT[role]||'#10b981';
  var inact=curTheme==='light'?'#555':curTheme==='green'?'rgba(180,255,200,.5)':'rgba(255,255,255,.45)';
  var tabDefs={
    customer:[{id:'home',ic:'🏠',lb:'Shops'},{id:'pickup',ic:'🏍️',lb:'Pickup'},{id:'cart',ic:'🛒',lb:'Cart'},{id:'orders',ic:'📦',lb:'Orders'},{id:'me',ic:'👤',lb:'Me'}],
    rider:[{id:'jobs',ic:'🏍️',lb:'Jobs'},{id:'earnings',ic:'💰',lb:'Earnings'}],
    shop:[{id:'orders',ic:'📋',lb:'Orders'},{id:'sales',ic:'💰',lb:'Sales'},{id:'stock',ic:'📦',lb:'Stock'},{id:'settings',ic:'⚙️',lb:'Settings'}],
    admin:[{id:'overview',ic:'📊',lb:'Overview'},{id:'orders',ic:'📋',lb:'Orders'},{id:'riders',ic:'🏍️',lb:'Riders'},{id:'shops',ic:'🏪',lb:'Shops'},{id:'revenue',ic:'💰',lb:'Revenue'}]
  };
  var tabs=tabDefs[role]||tabDefs.customer;
  var cartN=CART.reduce(function(s,i){return s+i.qty;},0);
  var html='<div style="display:flex;background:'+TNAV[curTheme]+';min-height:56px">';
  tabs.forEach(function(t){
    var isAct=tab===t.id;
    var color=isAct?actColor:inact;
    var badge=(t.id==='cart'&&cartN>0)?'<div style="position:absolute;top:2px;right:calc(50% - 14px);background:#ef4444;color:'+tc()+';border-radius:50%;width:14px;height:14px;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center">'+cartN+'</div>':'';
    html+='<div onclick="navTap(\''+role+'\',\''+t.id+'\')" style="flex:1;text-align:center;padding:8px 2px 5px;cursor:pointer;position:relative">'+badge+'<div style="font-size:20px">'+t.ic+'</div><div style="font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:'+color+'">'+t.lb+'</div></div>';
  });
  html+='</div>';
  nav.innerHTML=html;
}

function navTap(role,tab){
  if(role==='customer'){
    if(tab==='home'){showHome();return;}
    if(tab==='pickup'){showPickup();return;}
    if(tab==='cart'){showCart();return;}
    if(tab==='orders'){showOrders();return;}
    if(tab==='me'){showProfile();return;}
  }else if(role==='rider'){
    if(tab==='jobs'){showRiderJobs();return;}
    if(tab==='earnings'){showRiderEarnings();return;}
  }else if(role==='shop'){
    if(tab==='orders'){renderShopOrders();return;}
    if(tab==='sales'){showShopSales();return;}
    if(tab==='stock'){showShopStock();return;}
    if(tab==='settings'){showShopSettings();return;}
  }else if(role==='admin'){
    if(tab==='overview'){showAdminOverview();return;}
    if(tab==='orders'){showAdminOrders();return;}
    if(tab==='riders'){showAdminRiders();return;}
    if(tab==='shops'){showAdminShops();return;}
    if(tab==='revenue'){showAdminRevenue();return;}
  }
}

function showAuth(id,lbl,ic,col){authRole={id:id,lbl:lbl,ic:ic,col:col};authMode='register';renderAuth();}
function renderAuth(){
  var isS=authRole.id==='shop',isR=authRole.id==='rider',isA=authRole.id==='admin';
  var btnCls=isS?'btn-a':isR||isA?'btn-p':'btn-g';
  var sub=isA?'Restricted to authorised number only':isS?'Manage shop and receive delivery orders — free':isR?'Accept deliveries and pickups — earn daily':'Order from shops or request any pickup';
  pg().innerHTML='<div style="padding:20px 20px 80px"><div style="cursor:pointer;color:rgba(255,255,255,.4);margin-bottom:20px;font-size:13px;display:inline-flex;align-items:center;gap:6px" onclick="showRoleScreen()">← Back</div><div style="font-size:36px;margin-bottom:8px">'+authRole.ic+'</div><div style="font-size:20px;font-weight:700;color:'+authRole.col+';margin-bottom:6px">'+(authMode==='login'?'Welcome back':'Join as '+authRole.lbl)+'</div><div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:20px;line-height:1.5">'+sub+'</div>'+(authMode==='register'?'<div class="fld"><label>Full Name</label><input id="f-name" type="text" placeholder="e.g. Jane Achieng" autocomplete="off"/></div>':'')+'<div class="fld"><label>Phone Number (M-Pesa)</label><input id="f-phone" type="tel" placeholder="07XX XXX XXX" autocomplete="off"/></div>'+(authMode==='register'&&isS?'<div class="fld"><label>Shop Name</label><input id="f-shop" type="text" placeholder="e.g. Mama Jane Grocery" autocomplete="off"/></div>':'')+'<button class="btn '+btnCls+'" style="margin-top:8px" onclick="doAuth()">'+(authMode==='login'?'Login →':'Create Account →')+'</button><div class="divider">or</div><button class="btn btn-o" onclick="authMode=authMode===\'login\'?\'register\':\'login\';renderAuth()">'+(authMode==='login'?'Create new account':'Already registered? Login')+'</button></div>';
}
function doAuth(){
  var phone=(document.getElementById('f-phone')||{}).value||'';
  var name=(document.getElementById('f-name')||{}).value||'';
  var shopName=(document.getElementById('f-shop')||{}).value||'';
  var p=phone.trim().replace(/\s/g,'');
  if(!p||p.length<9){toast('Enter valid phone number');return;}
  if(authMode==='register'&&!name.trim()){toast('Enter your name');return;}
  if(authRole.id==='admin'){
    if(p!==SADMIN&&p!=='254799878872'&&p!=='+254799878872'){
      toast('❌ Admin access restricted');
      var pi=document.getElementById('f-phone');if(pi){pi.style.borderColor='#ef4444';setTimeout(function(){pi.style.borderColor='';},2000);}
      return;
    }
  }
  USER={role:authRole.id,name:(name||phone).trim(),phone:p,shopName:(shopName||'').trim(),preferred_rider:null,favourite_shops:[]};
  saveUser();
  dbSet('tumana_users',p,Object.assign({},USER,{updated_at:Date.now()}));
  startApp();
}

/* ── START APP ────────────────────────────────────────────────── */
function startApp(){
  if(!USER)return showRoleScreen();
  applyTheme();
  if(USER.role==='customer')startCustomer();
  else if(USER.role==='rider')startRider();
  else if(USER.role==='shop')startShop();
  else if(USER.role==='admin')startAdmin();
  else showRoleScreen();
}

function toggleFav(id){
  var cur=USER.favourite_shops||[];
  USER.favourite_shops=cur.indexOf(id)>=0?cur.filter(function(f){return f!==id;}):[].concat(cur,[id]);
  saveUser();dbSet('tumana_users',USER.phone,{favourite_shops:USER.favourite_shops});
  toast(cur.indexOf(id)>=0?'Removed from favourites':'⭐ Saved to favourites');showHome();
}

function showProducts(shopId){
  CURSHOP=(SHOPS.length?SHOPS:MOCK_SHOPS).filter(function(s){return s.id===shopId;})[0]||MOCK_SHOPS[0];
  setNav('customer','home');
  pg().innerHTML='<div style="padding:12px 18px;border-bottom:1px solid '+bdr()+'"><div onclick="showHome()" style="display:inline-flex;align-items:center;gap:5px;background:'+bgc2()+';border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;margin-bottom:12px">← All Shops</div><div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:20px">'+(CURSHOP.icon||'🏪')+'</div><div><div style="font-size:16px;font-weight:700">'+CURSHOP.name+'</div><div style="font-size:11px;color:'+tc2()+'">'+CURSHOP.location+' · '+CURSHOP.category+'</div></div></div></div><div id="prod-area" style="padding:11px 18px 100px"><div class="spin"></div></div>';
  loadFB(function(db){
    if(!db){renderProds(MOCK_PRODS[shopId]||[]);return;}
    db.collection('shops').doc(shopId).collection('stock').where('selling_price','>',0).get().then(function(s){
      var d=s.docs.map(function(doc){return Object.assign({id:doc.id},doc.data());}).filter(function(p){return p.quantity>0;});
      renderProds(d.length?d:(MOCK_PRODS[shopId]||[]));
    }).catch(function(){renderProds(MOCK_PRODS[shopId]||[]);});
  });
}
function renderProds(prods){
  var area=document.getElementById('prod-area');if(!area)return;
  if(!prods.length){area.innerHTML=empty('📦','No products yet','Shop owner needs to add stock');return;}
  var html='<div class="pgrid">';
  prods.forEach(function(p){
    var qty=0;CART.forEach(function(ci){if(ci.id===p.id)qty=ci.qty;});
    var enc=encodeURIComponent(p.name||'');
    html+='<div class="pc"><div class="pi">'+(p.emoji||p.icon||'📦')+'</div><div class="pb">'
      +'<div class="pn">'+p.name+'</div>'
      +'<div class="pp">KSh '+p.selling_price+'</div>'
      +(qty>0
        ?'<div class="qrow"><button class="qb qb-m" onclick="modCartData(this,-1)" data-id="'+p.id+'" data-name="'+enc+'" data-price="'+p.selling_price+'">−</button><span style="font-weight:700">'+qty+'</span><button class="qb qb-p" onclick="modCartData(this,1)" data-id="'+p.id+'" data-name="'+enc+'" data-price="'+p.selling_price+'">+</button></div>'
        :'<button class="add-b" onclick="modCartData(this,1)" data-id="'+p.id+'" data-name="'+enc+'" data-price="'+p.selling_price+'">Add +</button>')
      +'</div></div>';
  });
  html+='</div>';
  area.innerHTML=html;
}
function modCartData(btn,ch){
  var id=btn.dataset.id;
  var name=decodeURIComponent(btn.dataset.name||'');
  var price=parseFloat(btn.dataset.price)||0;
  modCart(id,name,price,ch);
}
function modCart(id,name,price,ch){
  if(!CURSHOP)return;
  var idx=-1;CART.forEach(function(c,i){if(c.id===id)idx=i;});
  if(idx>=0){CART[idx].qty+=ch;if(CART[idx].qty<=0)CART.splice(idx,1);}
  else{if(ch<1)return;if(CART.length&&CART[0].shopId!==CURSHOP.id){if(!confirm('Clear cart from '+CART[0].shopName+'?'))return;CART=[];}CART.push({id:id,name:name,price:price,qty:1,shopId:CURSHOP.id,shopName:CURSHOP.name,shopDist:CURSHOP.distance_km||.5});}
  if(ch>0)toast('Added: '+name);
  showProducts(CURSHOP.id);
}

}

function selFare(el,km,fee){
  document.querySelectorAll('.fare-card').forEach(function(c){c.classList.remove('sel');var t=c.querySelector('div div div:first-child');var p=c.querySelector('div:last-child div:first-child');if(t)t.style.color='inherit';if(p)p.style.color='inherit';});

function placePickup(){
  var from=(document.getElementById('pu-from')||{}).value||'';

  if(!to.trim()){toast('Enter drop-off destination');return;}
  var fee=_puFee||calcFee(1);
  dbAdd('delivery_orders',{type:'pickup',customer_phone:USER.phone,customer_name:USER.name,pickup_from:from.trim(),delivery_address:to.trim(),item_description:'Pickup: '+from.trim()+' to '+to.trim(),distance:_puDist||1,delivery_fee:fee,total:fee,rider_earnings:Math.round(fee*.9),platform_earnings:Math.round(fee*.1),status:'placed',rider_phone:null,rider_name:null,preferred_rider:USER.preferred_rider||null},function(){});

  pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:700;margin-bottom:4px">My Orders</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:12px">Live tracking</div></div><div id="ord-list" style="padding:0 18px 100px"><div class="spin"></div></div>';

function renderOrders(orders){

    var trackerHtml='';
    flow.forEach(function(key,i){

      trackerHtml+='<div style="display:flex;gap:9px;align-items:flex-start"><div style="display:flex;flex-direction:column;align-items:center;width:22px;flex-shrink:0"><div style="width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;background:'+(d?'#10b981':a?'#8b5cf6':'#1a1a22')+';color:'+(d?'#000':a?'#fff':'rgba(255,255,255,.2)')+';">'+(d?'✓':info.icon||'•')+'</div>'+(last?'':'<div style="width:2px;height:12px;margin:2px 0;background:'+(d?'#10b981':'rgba(255,255,255,.1)')+'"></div>')+'</div><div style="padding-bottom:10px;flex:1"><div style="font-size:12px;font-weight:700;color:'+(d?'#10b981':a?'#fff':'rgba(255,255,255,.3)')+'">'+label+'</div>'+(a?'<div style="font-size:10px;color:'+tc2()+'">Now</div>':'')+(d?'<div style="font-size:10px;color:#10b981">Done ✓</div>':'')+'</div></div>';
    });
    var isFav=USER.preferred_rider&&USER.preferred_rider.phone===o.rider_phone;
    var riderHtml=o.rider_name?'<div style="background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:8px;padding:9px;margin-top:7px;display:flex;align-items:center;gap:9px"><div style="font-size:20px">🏍️</div><div><div style="font-weight:700;font-size:13px">'+o.rider_name+'</div><div style="font-size:11px;color:'+tc2()+'">'+o.rider_phone+'</div></div><div style="margin-left:auto;text-align:center"><button onclick="saveFavRider(\''+o.rider_name+'\',\''+o.rider_phone+'\')" style="background:none;border:none;font-size:18px;cursor:pointer">'+(isFav?'⭐':'☆')+'</button><div style="font-size:9px;color:'+tc2()+'">'+(isFav?'Saved':'Save')+'</div></div></div>':'';

    html+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:9px"><div><div style="font-weight:700;font-size:14px">'+(o.type==='pickup'?'🏍️ Pickup':'🛒 Order')+' #'+o.id.slice(-6).toUpperCase()+'</div><div style="font-size:11px;color:rgba(255,255,255,.4);margin-top:2px">'+(o.shopName||o.pickup_from||'Order')+'</div></div><span class="spill '+sc+'">'+sl+'</span></div><div style="margin:10px 0 8px">'+trackerHtml+'</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:5px">'+desc+'</div><div style="font-weight:700;color:#10b981">KSh '+o.total+'</div>'+riderHtml+'</div>';
  });
  list.innerHTML=html;

            +'</div></div>';
        }).join(''):'<div style="background:'+bgc2()+';border-radius:12px;padding:24px;text-align:center;color:'+tc2()+'"><div style="font-size:32px;margin-bottom:8px">🎉</div><div style="font-weight:700;color:'+tc()+'">No outstanding debts</div></div>';
        el.innerHTML=tabHtml+recBtn
          +'<div style="background:rgba(239,68,68,.06);border:1.5px solid rgba(239,68,68,.2);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">'

        var todayT=allSales.filter(function(x){return new Date(x.created_at||0).toDateString()===today&&!x.is_debt;}).reduce(function(s,x){return s+(x.total||0);},0);

          +'<div class="stat-box"><div class="stat-v" style="color:#10b981">KSh '+allT.toLocaleString()+'</div><div class="stat-l">All Time</div></div>'
          +'</div>';

        }).join(''):'<div style="background:'+bgc2()+';border-radius:12px;padding:24px;text-align:center;color:'+tc2()+'"><div style="font-size:36px;margin-bottom:8px">💰</div><div style="font-weight:700;color:'+tc()+'">No sales yet</div></div>';

function saveSale(){
  var cust=(document.getElementById('rs-cust').value||'Walk-in').trim();
  var prod=(document.getElementById('rs-prod').value||'').trim();
  var amt=parseFloat(document.getElementById('rs-amt').value)||0;
  var ptype=window._payType||'cash';
  var isDebt=ptype==='debt';
  var phone=(document.getElementById('rs-phone')&&document.getElementById('rs-phone').value||'').trim();
  if(!prod){toast('Enter product/item name');return;}
  if(!amt){toast('Enter amount');return;}
  loadFB(function(db){
    if(!db){toast('No connection');return;}
    db.collection('shops').doc(USER.phone).collection('sales').add({
      customer_name:cust,product_name:prod,total:amt,
      payment_type:ptype,is_debt:isDebt,debt_paid:false,customer_phone:phone,
      created_at:Date.now(),shop_phone:USER.phone
    }).then(function(){
      toast(isDebt?'Debt recorded: '+cust+' owes KSh '+amt:'Sale saved: KSh '+amt);
      hideSheet();renderSalesView('sales',null);
    }).catch(function(){toast('Error saving');});
  });
}

function saveEditProduct(id){
  var sell=parseFloat(document.getElementById('ep-sell').value)||0;
  var cost=parseFloat(document.getElementById('ep-cost').value)||0;
  var qty=parseInt(document.getElementById('ep-qty').value)||0;
  var emoji=document.getElementById('ep-emoji').value||'X';
  loadFB(function(db){
    if(!db){toast('No connection');return;}
    db.collection('shops').doc(USER.phone).collection('stock').doc(id)
    .update({selling_price:sell,cost_price:cost,quantity:qty,emoji:emoji})
    .then(function(){toast('Updated!');hideSheet();showShopStock();})
    .catch(function(){toast('Error');});
  });
}
function quickRestock(id,current){

    +'<button class="btn btn-g" onclick="doRestock(this)" data-id="'+id+'" data-qty="'+current+'">Add Stock</button>'
    +'<button class="btn btn-o" style="margin-top:6px" onclick="hideSheet()">Cancel</button>');
}
function doRestock(btn){
  saveRestock(btn.dataset.id, parseInt(btn.dataset.qty)||0);
}
function saveRestock(id,current){
  var add=parseInt(document.getElementById('rs-qty').value)||0;
  if(!add){toast('Enter quantity');return;}
  loadFB(function(db){
    if(!db){toast('No connection');return;}
    db.collection('shops').doc(USER.phone).collection('stock').doc(id)
    .update({quantity:current+add})
    .then(function(){toast('Stock updated: '+(current+add));hideSheet();showShopStock();})
    .catch(function(){toast('Error');});
  });
}
function deleteProduct(id,nameEnc){
  var name=decodeURIComponent(nameEnc);

  loadFB(function(db){

    db.collection('shops').doc(USER.phone).collection('stock').doc(id)
    .delete().then(function(){toast('Deleted: '+name);hideSheet();showShopStock();})
    .catch(function(){toast('Error');});

}

function toggleRider(){
  riderOnline=!riderOnline;
  dbSet('riders',USER.phone,{online:riderOnline,name:USER.name,phone:USER.phone});
  toast(riderOnline?'Online - receiving jobs':'Offline');
  if(riderOnline)startJobListen();else{if(riderUnsub)riderUnsub();riderJobs=[];}
  showRiderJobs();
}
function startJobListen(){
  if(riderUnsub)riderUnsub();
  riderUnsub=dbListenIn('delivery_orders','status',['confirmed','placed'],function(jobs){
    riderJobs=jobs.filter(function(j){return !j.rider_phone;});// Rejected riders see no jobs
if(USER&&USER.rider_verified===false){riderJobs=[];}
    var c=document.getElementById('jobs-count');if(c)c.textContent=riderJobs.length;
    renderRiderBody();
  });
}
function startActiveListen(){
  if(riderActUnsub)riderActUnsub();
  riderActUnsub=dbListen('delivery_orders','rider_phone','==',USER.phone,function(orders){
    riderActive=orders.filter(function(o){return['assigned','heading','picked','transit'].indexOf(o.status)>=0;})[0]||null;
    renderRiderBody();
  });
}
function acceptJob(jobId){
  var job=null;riderJobs.forEach(function(j){if(j.id===jobId)job=j;});if(!job)return;
  dbUpdate('delivery_orders',jobId,{rider_phone:USER.phone,rider_name:USER.name,status:'assigned'},function(){});
  toast('Accepted! Head to '+(job.type==='pickup'?job.pickup_from:job.shopName));
  riderJobs=riderJobs.filter(function(j){return j.id!==jobId;});renderRiderBody();
}
function advanceJob(){
  if(!riderActive)return;
  var ns=NEXT_ST[riderActive.status];if(!ns)return;
  dbUpdate('delivery_orders',riderActive.id,{status:ns},function(){});
  if(ns==='delivered'){
    var e=Math.round((riderActive.delivery_fee||70)*.9);riderEarned+=e;
    loadFB(function(db){if(db){try{db.collection('riders').doc(USER.phone).update({total_earnings:firebase.firestore.FieldValue.increment(e),orders_completed:firebase.firestore.FieldValue.increment(1)}).catch(function(){});}catch(err){}}});
    riderActive=null;toast('Delivered! KSh '+e+' earned');
  }else{riderActive=Object.assign({},riderActive,{status:ns});}
  renderRiderBody();
}

  }
  if(!riderOnline){html+='<div class="empty"><div class="ei">😴</div><div class="et">You\'re Offline</div><div class="es">Toggle Online to receive deliveries and pickups</div></div>';}
  else if(!riderJobs.length&&!riderActive){html+='<div class="empty"><div class="ei">⏳</div><div class="et">No jobs yet</div><div class="es">Jobs appear when shops confirm payment</div></div>';}
  else{
    if(riderJobs.length)html+='<div style="font-size:10px;font-weight:700;color:#8b5cf6;text-transform:uppercase;margin-bottom:8px">'+riderJobs.length+' Available</div>';

    });

tn-o" onclick="if(confirm(\'Logout?\'))logout()" style="margin-top:8px">Logout</button>';

function showAdminRiders(){
  setNav('admin','riders');
  pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:800;margin-bottom:4px">All Riders</div><div style="font-size:12px;color:'+tc2()+';margin-bottom:12px">Verify real riders · Remove fakes</div></div><div id="admin-body" style="padding:0 18px 100px"><div class="spin"></div></div>';
  dbAll('riders',function(riders){
    var ab=document.getElementById('admin-body');if(!ab)return;
    if(!riders.length){ab.innerHTML='<div class="empty"><div class="ei">🏍️</div><div class="et">No riders</div><div class="es">Riders appear when they register</div></div>';return;}
    var pending=riders.filter(function(r){return r.verified===undefined||r.verified===null;});
    var verified=riders.filter(function(r){return r.verified===true;});
    var rejected=riders.filter(function(r){return r.verified===false;});
    var html='';
    if(pending.length){
      html+='<div style="font-size:10px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">⏳ Pending ('+pending.length+')</div>';
      html+=pending.map(function(r){return buildRiderCard(r,'pending');}).join('');

    if(verified.length){

      html+='<div style="font-size:10px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">❌ Rejected ('+rejected.length+')</div>';
      html+=rejected.map(function(r){return buildRiderCard(r,'rejected');}).join('');

    ab.innerHTML=html;

function buildRiderCard(r,status){
  var clr=status==='verified'?'#10b981':status==='rejected'?'#ef4444':'#f59e0b';
  var badge=status==='verified'?'✅ Verified':status==='rejected'?'❌ Rejected':'⏳ Pending';
  var verifyBtn=status!=='verified'?'<button onclick="verifyRider(this.dataset.id)" data-id="'+r.id+'" style="flex:1;padding:8px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#10b981;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">✅ Verify</button>':'';
  var rejectBtn=status!=='rejected'?'<button onclick="rejectRider(this.dataset.id)" data-id="'+r.id+'" style="flex:1;padding:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">❌ Reject</button>':'';
  var deleteBtn='<button onclick="deleteRider(this.dataset.id,this.dataset.n)" data-id="'+r.id+'" data-n="'+encodeURIComponent(r.name||r.id)+'" style="flex:1;padding:8px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#ef4444;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🗑️ Delete</button>';
  return '<div class="card" style="border-left:3px solid '+clr+';margin-bottom:10px">'
    +'<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">'
    +'<div><div style="font-weight:700;color:'+tc()+'">'+(r.name||r.id)+'</div>'
    +'<div style="font-size:11px;color:'+tc2()+'">'+(r.phone||r.id)+'</div>'
    +'<div style="font-size:11px;color:'+tc2()+'">'+(r.orders_completed||0)+' deliveries · KSh '+(r.total_earnings||0)+' earned</div>'
    +'<div style="font-size:11px;color:'+(r.online?'#10b981':tc3())+'">'+(r.online?'🟢 Online':'⚫ Offline')+'</div></div>'
    +'<span style="padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(0,0,0,.1);color:'+clr+'">'+badge+'</span></div>'
    +'<div style="display:flex;gap:6px">'+verifyBtn+rejectBtn+deleteBtn+'</div></div>';
}
function verifyRider(id){
  loadFB(function(db){if(!db)return;db.collection('riders').doc(id).update({verified:true}).then(function(){toast('✅ Rider verified');showAdminRiders();}).catch(function(){toast('Error');});});
}
function rejectRider(id){
  if(!confirm('Reject this rider? They will not receive jobs.'))return;
  loadFB(function(db){if(!db)return;db.collection('riders').doc(id).update({verified:false,online:false}).then(function(){toast('Rider rejected');showAdminRiders();}).catch(function(){toast('Error');});});
}
function deleteRider(id,nameEnc){
  var name=decodeURIComponent(nameEnc);
  if(!confirm('Delete rider "'+name+'"? Cannot be undone.'))return;
  loadFB(function(db){if(!db)return;db.collection('riders').doc(id).delete().then(function(){toast('Deleted: '+name);showAdminRiders();}).catch(function(){toast('Error');});});
}
function showAdminShops(){
  setNav('admin','shops');
  pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:800;margin-bottom:4px">All Shops</div><div style="font-size:12px;color:'+tc2()+';margin-bottom:12px">Verify real shops · Remove fakes</div></div><div id="admin-body" style="padding:0 18px 100px"><div class="spin"></div></div>';
  dbAll('shops',function(shops){
    var ab=document.getElementById('admin-body');if(!ab)return;
    if(!shops.length){ab.innerHTML='<div class="empty"><div class="ei">🏪</div><div class="et">No shops</div><div class="es">Shops appear when owners register</div></div>';return;}
    var pending=shops.filter(function(s){return !s.verified&&s.verified!==false;});
    var verified=shops.filter(function(s){return s.verified===true;});
    var rejected=shops.filter(function(s){return s.verified===false;});
    var html='';
    if(pending.length){
      html+='<div style="font-size:10px;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">⏳ Pending Verification ('+pending.length+')</div>';
      html+=pending.map(function(s){return buildShopCard(s,'pending');}).join('');
    }
    if(verified.length){
      html+='<div style="font-size:10px;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">✅ Verified ('+verified.length+')</div>';
      html+=verified.map(function(s){return buildShopCard(s,'verified');}).join('');
    }
    if(rejected.length){
      html+='<div style="font-size:10px;font-weight:700;color:#ef4444;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">❌ Rejected ('+rejected.length+')</div>';
      html+=rejected.map(function(s){return buildShopCard(s,'rejected');}).join('');
    }
    ab.innerHTML=html;
  });
}
function buildShopCard(s,status){
  var clr=status==='verified'?'#10b981':status==='rejected'?'#ef4444':'#f59e0b';
  var borderClr=status==='verified'?'rgba(16,185,129,.25)':status==='rejected'?'rgba(239,68,68,.25)':'rgba(245,158,11,.25)';
  var badge=status==='verified'?'✅ Verified':status==='rejected'?'❌ Rejected':'⏳ Pending';
  var verifyBtns=status!=='verified'?'<button onclick="verifyShop(this.dataset.id)" data-id="'+s.id+'" style="flex:1;padding:8px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#10b981;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">✅ Verify</button>':'';
  var rejectBtn=status!=='rejected'?'<button onclick="rejectShop(this.dataset.id)" data-id="'+s.id+'" style="flex:1;padding:8px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:#ef4444;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">❌ Reject</button>':'';
  var deleteBtn='<button onclick="deleteShop(this.dataset.id,this.dataset.n)" data-id="'+s.id+'" data-n="'+encodeURIComponent(s.name||s.id)+'" style="flex:1;padding:8px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:#ef4444;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">🗑️ Delete</button>';
  return '<div class="card" style="border-left:3px solid '+clr+';margin-bottom:10px">'
    +'<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">'
    +'<div style="display:flex;gap:10px;align-items:center">'
    +'<div style="font-size:28px">'+(s.icon||'🏪')+'</div>'
    +'<div><div style="font-weight:700;color:'+tc()+'">'+(s.name||s.id)+'</div>'
    +'<div style="font-size:11px;color:'+tc2()+'">'+(s.category||'General')+' · '+(s.location||'Chemelil')+'</div>'
    +'<div style="font-size:11px;color:'+tc2()+'">'+(s.owner_phone||s.id)+'</div>'
    +'<div style="font-size:11px;color:'+tc2()+'">Delivery: '+(s.delivery_enabled?'ON':'OFF')+'</div></div></div>'
    +'<span style="padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;background:rgba(0,0,0,.1);color:'+clr+'">'+badge+'</span></div>'
    +'<div style="display:flex;gap:6px">'+verifyBtns+rejectBtn+deleteBtn+'</div></div>';
}
function verifyShop(id){
  loadFB(function(db){if(!db)return;db.collection('shops').doc(id).update({verified:true}).then(function(){toast('✅ Shop verified — now visible to customers');showAdminShops();}).catch(function(){toast('Error');});});
}
function rejectShop(id){
  if(!confirm('Reject this shop? It will be hidden from customers.'))return;
  loadFB(function(db){if(!db)return;db.collection('shops').doc(id).update({verified:false,delivery_enabled:false}).then(function(){toast('Shop rejected and hidden');showAdminShops();}).catch(function(){toast('Error');});});
}
function deleteShop(id,nameEnc){
  var name=decodeURIComponent(nameEnc);
  if(!confirm('Permanently delete "'+name+'"? Cannot be undone.'))return;
  loadFB(function(db){if(!db)return;db.collection('shops').doc(id).delete().then(function(){toast('Deleted: '+name);showAdminShops();}).catch(function(){toast('Error');});});
}
function showAdminRevenue(){
  setNav('admin','revenue');
  pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:800;margin-bottom:12px">Revenue</div></div><div id="admin-body" style="padding:0 18px 100px"><div class="spin"></div></div>';
  loadFB(function(db){
    if(!db){document.getElementById('admin-body').innerHTML='<div class="empty"><div class="ei">💰</div><div class="et">Revenue</div><div class="es">Connect to Firebase to see data</div></div>';return;}
    db.collection('delivery_orders').where('status','==','delivered').get().then(function(s){
      var orders=s.docs.map(function(d){return d.data();});
      var ab=document.getElementById('admin-body');if(!ab)return;
      var today=new Date().toDateString();
      var todO=orders.filter(function(o){var d=o.created_at&&o.created_at.toDate?o.created_at.toDate():null;return d&&d.toDateString()===today;});
      var sum=function(arr,k){return arr.reduce(function(s,o){return s+(o[k]||0);},0);};
      ab.innerHTML='<div class="stat-box" style="text-align:center;margin-bottom:12px"><div style="font-size:11px;color:rgba(255,255,255,.4);margin-bottom:4px">TODAY</div><div style="font-size:28px;font-weight:800;color:#10b981">KSh '+sum(todO,'platform_earnings').toLocaleString()+'</div><div style="font-size:12px;color:rgba(255,255,255,.4);margin-top:4px">'+todO.length+' deliveries</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px"><div class="stat-box"><div class="stat-v" style="color:#8b5cf6;font-size:18px">KSh '+sum(orders,'platform_earnings').toLocaleString()+'</div><div class="stat-l">All Time</div></div><div class="stat-box"><div class="stat-v" style="color:#f59e0b;font-size:18px">'+orders.length+'</div><div class="stat-l">Deliveries</div></div></div><div class="sbox"><div class="sbox-t">Collection Number</div><div style="font-size:18px;font-weight:800;color:#10b981;margin-bottom:4px">'+MPESA+'</div><div style="font-size:12px;color:'+tc2()+'">All platform revenue collects here</div></div>';
    }).catch(function(){});
  });
}

/* BOOT */
function boot(){
  if(window._booted)return;
  window._booted=true;
  // Step 1: load saved user
  try{
    var s=localStorage.getItem('tumana_user');
    if(s){var p=JSON.parse(s);if(p&&p.role&&p.phone){if(!p.name)p.name=p.phone;if(['customer','rider','shop','admin'].indexOf(p.role)>=0)USER=p;}}
  }catch(e){localStorage.removeItem('tumana_user');}
  // Step 2: show app
  try{applyTheme();}catch(e){console.error('applyTheme:',e);}
  try{
    var ld=document.getElementById('loading');
    var wp=document.getElementById('wrap');
    if(ld)ld.style.display='none';
    if(wp)wp.style.display='flex';
  }catch(e){console.error('show wrap:',e);}
  // Step 3: route to correct screen
  try{
    if(USER)startApp();else showRoleScreen();
  }catch(e){
    // Show error visibly
    var ld2=document.getElementById('loading');
    if(ld2){
      ld2.style.display='flex';
      ld2.innerHTML='<div style="padding:24px;text-align:center">'
        +'<div style="font-size:28px;margin-bottom:12px">⚠️</div>'
        +'<div style="font-size:14px;font-weight:700;color:#ef4444;margin-bottom:8px">App Error</div>'
        +'<div style="font-size:12px;color:rgba(255,255,255,.6);word-break:break-all;margin-bottom:16px">'+e.message+'</div>'
        +'<button onclick="localStorage.clear();location.reload()" style="padding:10px 20px;background:#10b981;border:none;border-radius:8px;color:#000;font-weight:700;cursor:pointer">Clear & Retry</button>'
        +'</div>';
    }
    console.error('startApp/showRoleScreen:',e);
  }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();});});
}

// Back button → go to home screen instead of exiting app
window.history.pushState(null,'',window.location.href);
window.addEventListener('popstate',function(){
  window.history.pushState(null,'',window.location.href);
  if(USER){
    if(USER.role==='customer')showHome();
    else if(USER.role==='rider')showRiderJobs();
    else if(USER.role==='shop')renderShopDash();
    else if(USER.role==='admin')showAdminOverview();
  } else {
    showRoleScreen();
  }
});

// Fix rider ZZ - replace with proper emoji
boot();
</script>
