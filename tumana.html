  const phone=(document.getElementById('f-phone')||{}).value||'';

  USER={role:authRole.id,name:safeName,phone:phone.trim(),shopName:shopName.trim(),preferred_rider:null,favourite_shops:[]};

function renderProds(prods){
  const area=document.getElementById('prod-area');if(!area)return;
  if(!prods.length){area.innerHTML=empty('📦','No products yet','Shop has no stock added yet');return;}
  area.innerHTML=`<div class="pgrid">${prods.map(p=>{
    const qty=CART.find(c=>c.id===p.id)?.qty||0;
    return `<div class="pc"><div class="pi">${p.emoji||p.icon||'🛒'}</div><div class="pb"><div class="pn">${p.name}</div><div class="pp">KSh ${p.selling_price}</div>${qty>0?`<div class="qrow"><button class="qb qb-m" onclick="modCart('${p.id}','${p.name}',${p.selling_price},-1)">−</button><span style="font-weight:700">${qty}</span><button class="qb qb-p" onclick="modCart('${p.id}','${p.name}',${p.selling_price},1)">+</button></div>`:`<button class="add-b" onclick="modCart('${p.id}','${p.name}',${p.selling_price},1)">Add +</button>`}</div></div>`;
  }).join('')}</div>`;
}
function modCart(id,name,price,ch){
  if(!CURRENTSHOP)return;
  const idx=CART.findIndex(i=>i.id===id);
  if(idx>=0){CART[idx].qty+=ch;if(CART[idx].qty<=0)CART.splice(idx,1);}
  else{
    if(ch<1)return;
    if(CART.length&&CART[0].shopId!==CURRENTSHOP.id){if(!confirm('Clear cart from '+CART[0].shopName+'?'))return;CART=[];}
    CART.push({id,name,price,qty:1,shopId:CURRENTSHOP.id,shopName:CURRENTSHOP.name,shopDist:CURRENTSHOP.distance_km||.5});
  }
  if(ch>0)toast('Added: '+name);
  showProducts(CURRENTSHOP.id);
}

function showOrders(){
  setTitle('TUMANA','#10b981');setNav('customer','orders');
  pg().innerHTML=`<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:700;margin-bottom:4px">My Orders</div><div style="font-size:12px;color:var(--txt2);margin-bottom:12px">Live tracking · 7 stages</div></div><div id="orders-body" style="padding:0 18px 100px"><div class="spin"></div></div>`;
  if(ordersUnsub)ordersUnsub();
  loadFB(db=>{
    if(!db){document.getElementById('orders-body').innerHTML=empty('📦','No orders yet','Shop orders and pickups appear here');return;}
    const unsub=db.collection('delivery_orders').where('customer_phone','==',USER.phone).limit(30)
      .onSnapshot(s=>{
        const orders=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));

function renderOrders(orders){
  const b=document.getElementById('orders-body');if(!b)return;

    const flow=SF[o.type||'shop'];const ci=flow.indexOf(o.status);
    const tracker=flow.map((key,i)=>{
      const d=i<ci,a=i===ci,last=i===flow.length-1;
      const info=SL[key]||{};const label=info[o.type||'shop']||key;
      return `<div class="tr-step"><div style="display:flex;flex-direction:column;align-items:center;width:22px;flex-shrink:0"><div class="tr-dot ${d?'done':a?'now':'todo'}">${d?'✓':info.icon||'•'}</div>${!last?`<div class="tr-line ${d?'done':'todo'}"></div>`:''}</div><div style="padding-bottom:10px;flex:1"><div style="font-size:12px;font-weight:700;color:${d?'#10b981':a?'#fff':'rgba(255,255,255,.3)'}">${label}</div>${a?'<div style="font-size:10px;color:var(--txt2)">Now</div>':d?'<div style="font-size:10px;color:#10b981">Done ✓</div>':''}</div></div>`;
    }).join('');
    const isFav=USER.preferred_rider?.phone===o.rider_phone;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:9px">
        <div><div style="font-weight:700;font-size:14px">${o.type==='pickup'?'🏍️ Pickup':'🛒 Order'} #${o.id.slice(-6).toUpperCase()}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">${o.shopName||o.pickup_from||'Order'}</div></div>
        <span class="spill ${sp}">${lb}</span>
      </div>
      <div style="margin:10px 0 8px">${tracker}</div>
      <div style="font-size:12px;color:var(--txt2);margin-bottom:5px">${o.type==='pickup'?(o.pickup_from||'')+' → '+(o.delivery_address||''):(o.items||[]).map(i=>i.name+' ×'+i.quantity).join(' · ')}</div>
      <div style="font-weight:700;color:#10b981">KSh ${o.total}</div>
      ${o.rider_name?`<div style="background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.15);border-radius:8px;padding:9px;margin-top:7px;display:flex;align-items:center;gap:9px"><div style="font-size:20px">🏍️</div><div><div style="font-weight:700;font-size:13px">${o.rider_name}</div><div style="font-size:11px;color:var(--txt2)">${o.rider_phone}</div></div><div style="margin-left:auto;text-align:center"><button style="background:none;border:none;font-size:18px;cursor:pointer" onclick="saveFavRider('${o.rider_name}','${o.rider_phone}')">${isFav?'⭐':'☆'}</button><div style="font-size:9px;color:var(--txt2)">${isFav?'Saved':'Save'}</div></div></div>`:''}
    </div>`;
  }).join('');
}

function switchShopTab(tab,el){

function loadShopOrders(){
  if(shopUnsub)shopUnsub();

      .onSnapshot(s=>{

function startJobListen(){

async function acceptJob(jobId){
  const job=riderJobs.find(j=>j.id===jobId);if(!job)return;
  const ok=await dbUpdate('delivery_orders',jobId,{rider_phone:USER.phone,rider_name:USER.name,status:'assigned'});
  if(!ok){riderActive={...job,status:'assigned',rider_name:USER.name,rider_phone:USER.phone};riderJobs=riderJobs.filter(j=>j.id!==jobId);}
  toast('✅ Accepted! Head to '+(job.type==='pickup'?job.pickup_from:job.shopName));
  renderRiderBody();
}
async function advanceJob(){
  if(!riderActive)return;
  const ns=NEXT_ST[riderActive.status];if(!ns)return;
  await dbUpdate('delivery_orders',riderActive.id,{status:ns});
  if(ns==='delivered'){
    const e=Math.round((riderActive.delivery_fee||70)*.9);riderEarned+=e;
    loadFB(db=>{if(db&&typeof firebase!=='undefined')db.collection('riders').doc(USER.phone).update({total_earnings:firebase.firestore.FieldValue.increment(e),orders_completed:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});});
    riderActive=null;toast('🎉 Delivered! KSh '+e+' earned');
  } else riderActive={...riderActive,status:ns};
  renderRiderBody();
}

    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:#ef4444;text-transform:uppercase;margin-bottom:8px">🔴 Active Delivery</div>
    <div class="card" style="border:2px solid #10b981">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px"><div><div style="font-weight:700;font-size:14px">${a.type==='pickup'?'🏍️ Pickup':'🛒 Delivery'} #${a.id.slice(-6).toUpperCase()}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">${a.shopName||a.item_description||''}</div></div><div style="font-weight:800;color:#10b981;font-size:20px">KSh ${Math.round((a.delivery_fee||70)*.9)}</div></div>
      <div style="display:flex;align-items:center;gap:4px;margin:8px 0 12px">${dots}</div>
      <div style="display:flex;gap:9px;margin:8px 0"><div style="width:30px;height:30px;border-radius:8px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🏪</div><div><div style="font-size:9px;color:#10b981;font-weight:700">PICKUP FROM</div><div style="font-weight:700">${a.shopName||a.pickup_from||''}</div><div style="font-size:11px;color:var(--txt2)">${a.shopLocation||a.pickup_from||''}</div></div></div>
      <div style="display:flex;gap:9px;margin:8px 0"><div style="width:30px;height:30px;border-radius:8px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">📍</div><div><div style="font-size:9px;color:#8b5cf6;font-weight:700">DELIVER TO</div><div style="font-weight:700">${a.customer_name||''}</div><div style="font-size:11px;color:var(--txt2)">${a.delivery_address||''}</div></div></div>
      ${a.item_description?`<div style="display:flex;gap:9px;margin:8px 0"><div style="width:30px;height:30px;border-radius:8px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">📝</div><div><div style="font-size:9px;color:#f59e0b;font-weight:700">ITEM</div><div style="font-size:13px">${a.item_description}</div></div></div>`:''}
      ${NEXT_ST[a.status]?`<button class="btn btn-g" style="margin-top:10px" onclick="advanceJob()">${NEXT_LB[a.status]}</button>`:''}
    </div>`;
  }
  if(!riderOnline){html+=empty('😴','You\'re Offline','Toggle Online to receive deliveries and pickup requests');}
  else if(!riderJobs.length&&!riderActive){html+=empty('⏳','No jobs yet','Jobs appear the moment a shop confirms payment');}
  else if(riderJobs.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:1.5px;color:#8b5cf6;text-transform:uppercase;margin-bottom:8px">🔔 ${riderJobs.length} Available</div>`;
    html+=riderJobs.map(job=>{
      const rg=Math.round((job.delivery_fee||70)*.9);
      return `<div class="card" style="border:1.5px solid rgba(139,92,246,.22);position:relative">
        ${job.type==='pickup'?`<div style="position:absolute;top:10px;right:10px;background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.25);font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px">PICKUP</div>`:`<div style="position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px">DELIVERY</div>`}
        <div style="display:flex;justify-content:space-between;margin-bottom:10px;padding-right:80px"><div><div style="font-weight:700">${job.type==='pickup'?'Pickup & Drop':'Shop Delivery'}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">#${job.id.slice(-6).toUpperCase()}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#10b981">KSh ${rg}</div><div style="font-size:9px;color:var(--txt2)">your cut</div></div></div>
        <div style="display:flex;gap:9px;margin:8px 0"><div style="width:30px;height:30px;border-radius:8px;background:${job.type==='pickup'?'rgba(245,158,11,.1)':'rgba(16,185,129,.1)'};border:1px solid ${job.type==='pickup'?'rgba(245,158,11,.2)':'rgba(16,185,129,.2)'};display:flex;align-items:center;justify-content:center;font-size:14px">${job.type==='pickup'?'📍':'🏪'}</div><div><div style="font-size:9px;color:${job.type==='pickup'?'#f59e0b':'#10b981'};font-weight:700">${job.type==='pickup'?'PICKUP FROM':'SHOP'}</div><div style="font-weight:700">${job.type==='pickup'?job.pickup_from:job.shopName}</div><div style="font-size:11px;color:var(--txt2)">${job.type==='pickup'?job.item_description||'':job.shopLocation||''}</div></div></div>
        <div style="display:flex;gap:9px;margin:8px 0"><div style="width:30px;height:30px;border-radius:8px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);display:flex;align-items:center;justify-content:center;font-size:14px">📍</div><div><div style="font-size:9px;color:#8b5cf6;font-weight:700">DELIVER TO</div><div style="font-weight:700">${job.customer_name}</div><div style="font-size:11px;color:var(--txt2)">${job.delivery_address}</div></div></div>
        <div style="background:rgba(16,185,129,.05);border:1.5px solid rgba(16,185,129,.13);border-radius:9px;padding:9px;margin:8px 0;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--txt2)">${job.distance}km · KSh ${job.delivery_fee} fee</span><span style="font-weight:800;color:#10b981">You: KSh ${rg}</span></div>
        ${job.preferred_rider?.phone===USER.phone?`<div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:7px;font-size:11px;color:#fbbf24;margin-bottom:7px">⭐ This customer chose you as favourite rider!</div>`:''}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px"><button style="background:transparent;border:1.5px solid rgba(239,68,68,.3);color:#ef4444;padding:9px;border-radius:8px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer">❌ Decline</button><button style="background:linear-gradient(135deg,#10b981,#059669);border:none;color:#000;padding:9px;border-radius:8px;font-weight:700;font-size:12px;font-family:inherit;cursor:pointer" onclick="acceptJob('${job.id}')">✅ Accept</button></div>
      </div>`;
    }).join('');
  }
  b.innerHTML=html;
}
function showRiderEarnings(){
  setTitle('RIDER','#8b5cf6');setNav('rider','earnings');
  pg().innerHTML=`<div style="background:linear-gradient(180deg,#0d0820,#08080c);padding:18px 18px 0"><div style="font-size:20px;font-weight:800;margin-bottom:2px">My Earnings</div><div style="font-size:12px;color:var(--txt2);margin-bottom:14px">Track income · Daily M-Pesa payouts</div></div><div id="earn-body" style="padding:10px 18px 100px"><div class="spin"></div></div>`;
  loadFB(db=>{
    if(!db){document.getElementById('earn-body').innerHTML=empty('💰','Earnings','Connect to see your full earnings history');return;}
    Promise.all([
      db.collection('riders').doc(USER.phone).get().catch(()=>({exists:false,data:()=>({})})),
      db.collection('delivery_orders').where('rider_phone','==',USER.phone).where('status','==','delivered').limit(50).get().catch(()=>({docs:[]}))
    ]).then(([riderDoc,histSnap])=>{
      const data=riderDoc.exists?riderDoc.data():{total_earnings:0,orders_completed:0,rating:5.0};
      const hist=histSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created_at?.seconds||0)-(a.created_at?.seconds||0));
      const today=new Date().toDateString();
      const todayE=hist.filter(h=>{const d=h.delivered_at?.toDate?.()||h.created_at?.toDate?.();return d&&d.toDateString()===today;}).reduce((s,h)=>s+Math.round((h.delivery_fee||70)*.9),0);
      const weekStart=new Date();weekStart.setDate(weekStart.getDate()-7);
      const weekE=hist.filter(h=>{const d=h.delivered_at?.toDate?.()||h.created_at?.toDate?.();return d&&d>=weekStart;}).reduce((s,h)=>s+Math.round((h.delivery_fee||70)*.9),0);
      const b=document.getElementById('earn-body');if(!b)return;
      b.innerHTML=`
        <div class="stat-grid"><div class="stat-box"><div class="stat-v" style="color:#10b981">KSh ${todayE+riderEarned}</div><div class="stat-l">Today</div></div><div class="stat-box"><div class="stat-v" style="color:#8b5cf6">KSh ${weekE}</div><div class="stat-l">This Week</div></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
          <div class="stat-box" style="text-align:center"><div class="stat-v" style="font-size:16px">KSh ${data.total_earnings||0}</div><div class="stat-l">All Time</div></div>
          <div class="stat-box" style="text-align:center;border-left:1px solid rgba(255,255,255,.07);border-right:1px solid rgba(255,255,255,.07)"><div class="stat-v" style="font-size:16px">${data.orders_completed||0}</div><div class="stat-l">Deliveries</div></div>
          <div class="stat-box" style="text-align:center"><div class="stat-v" style="font-size:16px;color:#fbbf24">⭐${(data.rating||5).toFixed(1)}</div><div class="stat-l">Rating</div></div>
        </div>
        <div class="sbox"><div class="sbox-t">📱 Payout Info</div><div style="font-size:13px;color:var(--txt2);line-height:1.7">M-Pesa: <strong style="color:#fff">${USER.phone}</strong><br>Time: <strong style="color:#fff">Every evening by 8 PM</strong><br>Minimum: <strong style="color:#fff">KSh 100</strong></div></div>
        <div style="font-size:11px;font-weight:700;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px">Delivery History</div>
        ${hist.length===0?empty('📋','No deliveries yet','Complete your first delivery to see history here'):hist.map(h=>{
          const e=Math.round((h.delivery_fee||70)*.9);
          const d=h.delivered_at?.toDate?.()||h.created_at?.toDate?.();
          return `<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:700;font-size:13px">${h.type==='pickup'?'🏍️ Pickup':'🛒 Delivery'} #${h.id.slice(-6).toUpperCase()}</div><div style="font-size:11px;color:var(--txt2);margin-top:2px">${h.shopName||h.pickup_from||''} → ${h.delivery_address||''}</div><div style="font-size:10px;color:var(--txt3);margin-top:2px">${d?d.toLocaleDateString('en-KE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Recent'}</div></div><div style="text-align:right"><div style="font-size:18px;font-weight:800;color:#10b981">+KSh ${e}</div><div style="font-size:10px;color:var(--txt2)">of KSh ${h.delivery_fee}</div></div></div>`;
        }).join('')}`;
    });
  });
}

// BOOT
// ══════════════════════════════════════════════════════════
function startApp(){
  if(!USER)return showRoleScreen();
  if(USER.role==='customer')startCustomer();
  else if(USER.role==='shop')startShop();
  else if(USER.role==='rider')startRider();
}

function boot(){
  if(window._booted)return;
  window._booted=true;
  // Fix: if page is blank/404, redirect to correct URL
  if(document.title===''||document.body.children.length===0){
    window.location.href='https://kwachdavid123-beep.github.io/Chawkpro/tumana.html';
    return;
  }
  applyTheme();
  try{
    const s=localStorage.getItem('tumana_user');
    if(s){const p=JSON.parse(s);if(p&&p.role&&p.phone){if(!p.name)p.name=p.phone;if(['customer','shop','rider'].includes(p.role))USER=p;}}
  }catch(e){localStorage.removeItem('tumana_user');}
  document.getElementById('loading').style.display='none';
  document.getElementById('wrap').style.display='flex';
  if(USER)startApp();else showRoleScreen();
}

// Unregister ALL service workers - they cause redirect issues
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){r.unregister();});
  });
  // Clear all caches too
  if(window.caches){
    caches.keys().then(function(keys){
      keys.forEach(function(k){caches.delete(k);});
    });
  }
}

// PWA Install prompt - simple version
let _installPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  _installPrompt=e;
  setTimeout(showInstallBanner,3000);
});
function showInstallBanner(){
  if(!_installPrompt)return;
  var b=document.createElement('div');
  b.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#10b981;color:#000;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9998;box-shadow:0 4px 20px rgba(16,185,129,.4);cursor:pointer';
  b.textContent='🚴 Install Tumana App — Tap here';
  b.onclick=function(){
    if(_installPrompt){
      _installPrompt.prompt();
      _installPrompt.userChoice.then(function(){_installPrompt=null;b.remove();});
    }
  };
  document.body.appendChild(b);
}

// Script is at bottom of body so DOM is already ready
// Call boot directly - no need to wait
boot();
