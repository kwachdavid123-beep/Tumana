<script>

// ── ONE-TIME ZOMBIE SW CLEANUP ── runs before EVERYTHING else.
// Uses a URL marker (not localStorage) so this can NEVER loop forever,
// even if storage is blocked, partitioned, or behaves unexpectedly
// inside an installed APK/TWA webview.
(function(){
  var alreadyCleared = window.location.search.indexOf('_cleared=1') >= 0;
  if (alreadyCleared) return; // guaranteed: this branch never reloads again

  if ('serviceWorker' in navigator) {
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function(regs){
        return Promise.all(regs.map(function(r){ return r.unregister(); }));
      }),
      ('caches' in window) ? caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){ return caches.delete(k); }));
      }) : Promise.resolve()
    ]).then(function(){
      var sep = window.location.href.indexOf('?') >= 0 ? '&' : '?';
      window.location.replace(window.location.href + sep + '_cleared=1');
    }).catch(function(){
      var sep = window.location.href.indexOf('?') >= 0 ? '&' : '?';
      window.location.replace(window.location.href + sep + '_cleared=1');
    });
  }
})();

</script>
<script>

// ── BOOT WATCHDOG ── runs independently of the main app script.
// If the main script throws before boot() hides #loading, OR if
// boot() never finishes within 6s, show the actual error so the
// loading screen never spins forever with no information.
(function(){
  var shown=false;
  function showBootError(msg){
    if(shown)return;shown=true;
    var ld=document.getElementById('loading');
    var err=document.getElementById('boot-err');
    if(!ld||!err)return;
    err.style.display='block';
    err.innerHTML='<div style="font-size:13px;font-weight:700;color:#dc2626;margin-bottom:6px">App failed to load</div>'
      +'<div style="font-size:11px;color:#6b7280;line-height:1.6;margin-bottom:14px;word-break:break-word">'+msg+'</div>'
      +'<button id="bw-reload" style="width:100%;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;margin-bottom:8px">Reload Page</button>'
      +'<button id="bw-clear" style="width:100%;padding:11px;border-radius:10px;border:1.5px solid #d1d5db;background:transparent;color:#6b7280;font-weight:700;font-size:13px;font-family:inherit;cursor:pointer">Clear Saved Data &amp; Reload</button>';
    var rb=document.getElementById('bw-reload');
    if(rb)rb.addEventListener('click',function(){location.reload(true);});
    var cb=document.getElementById('bw-clear');
    if(cb)cb.addEventListener('click',function(){try{localStorage.clear();}catch(e){}location.reload(true);});
  }
  window.addEventListener('error',function(e){
    var msg=(e&&e.message?e.message:'Unknown error');
    var loc=(e&&e.filename?' (line '+e.lineno+')':'');
    showBootError(msg+loc);
  });
  setTimeout(function(){
    var ld=document.getElementById('loading');
    if(ld&&ld.style.display!=='none'){
      showBootError('Taking longer than expected. The app script may not have started correctly.');
    }
  },6000);
})();

</script>

function loadFB(cb){
  if(_db){cb(_db);return;}
  _fbQ.push(cb);if(_fbL)return;_fbL=true;
  function ls(src,next,bg){var s=document.createElement('script');s.src=src;s.onload=next;s.onerror=bg?function(){}:function(){_fbQ.forEach(function(f){f(null);});_fbQ=[];};document.head.appendChild(s);}
  // STEP 1: Load app SDK (required first)
  ls('https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js',function(){
    try{if(!firebase.apps.length)firebase.initializeApp(FBC);}catch(e){}
    // STEP 2: Load firestore only — this is the critical path for login/data.
    // Functions + Messaging are NOT loaded here anymore (they used to load
    // in parallel on every single boot, adding 2 extra network requests
    // before the user even logs in). They now load lazily, on-demand,
    // only when actually needed — see loadFBExtras() below.
    ls('https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js',function(){
      try{_db=firebase.firestore();}catch(e){_db=null;}
      _fbQ.forEach(function(f){f(_db);});_fbQ=[];
    });
  });
}

// ── LAZY-LOADED EXTRAS: Cloud Functions + Push Messaging ──────────
// Only fetched the first time callFn() or initFCM() is actually needed
// (e.g. after a successful login, or when calling a cloud function) —
// not on every cold app launch. Cuts initial load time noticeably.
var _fbExtrasLoading=false, _fbExtrasQ=[];
function loadFBExtras(cb){
  if(_fn){cb();return;}
  _fbExtrasQ.push(cb);
  if(_fbExtrasLoading)return;
  _fbExtrasLoading=true;
  loadFB(function(){
    function ls2(src,next){var s=document.createElement('script');s.src=src;s.onload=next;s.onerror=next;document.head.appendChild(s);}
    ls2('https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js',function(){
      try{_fn=firebase.functions();}catch(e){}
      ls2('https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js',function(){
        _fbExtrasQ.forEach(function(f){f();});_fbExtrasQ=[];
      });
    });
  });
}
// ── CLOUD FUNCTIONS ────────────────────────────────────────
function callFn(name,data,cb){
  loadFBExtras(function(){
    if(!_fn){if(cb)cb({ok:false,error:'Functions not loaded'});return;}
    var fn=_fn.httpsCallable(name);
    fn(data).then(function(result){if(cb)cb(result.data);}).catch(function(err){if(cb)cb({ok:false,error:err.message});});
  });
}

// ── FCM PUSH NOTIFICATIONS ──────────────────────────────────
var FCM_TOKEN=null;
function initFCM(){
  try{
    var msg=firebase.messaging();
    // Request permission
    // Delay permission request by 8 seconds after login
    // so it doesn't pop up immediately like an intrusive browser dialog
    setTimeout(function(){
      if(typeof Notification==='undefined')return;
      if(Notification.permission==='granted'){
        doGetToken(msg);
      } else if(Notification.permission!=='denied'){
        // Show a friendly in-app prompt first (implemented in showNotifPrompt)
        showNotifPrompt(function(allowed){
          if(allowed) Notification.requestPermission().then(function(p){if(p==='granted')doGetToken(msg);});
        });
      }
    }, 8000);
    // Handle foreground messages
    msg.onMessage(function(payload){
      var n=payload.notification||{};
      toast((n.title?n.title+': ':'')+( n.body||'New notification'));
    });
  }catch(e){console.log('FCM init error:',e);}
}

function dbSet(col,id,d){loadFB(function(db){if(db)db.collection(col).doc(id).set(d,{merge:true}).catch(function(){});});}
function dbGet(col,id,cb){loadFB(function(db){if(!db)return cb(null);db.collection(col).doc(id).get().then(function(d){cb(d.exists?Object.assign({id:d.id},d.data()):null);}).catch(function(){cb(null);});});}
function dbAdd(col,d){loadFB(function(db){if(!db)return;db.collection(col).add(Object.assign({},d,{ts:firebase.firestore.FieldValue.serverTimestamp()})).catch(function(){});});}
function dbUpd(col,id,d,cb){loadFB(function(db){if(!db){if(cb)cb(false);return;}db.collection(col).doc(id).update(d).then(function(){if(cb)cb(true);}).catch(function(){if(cb)cb(false);});});}
function dbListen(col,f,op,v,cb){
  var unsub=null;
  loadFB(function(db){
    if(!db){cb([]);return;}
    unsub=db.collection(col).where(f,op,v).limit(50).onSnapshot(
      function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},
      function(e){console.log('dbListen error:',e.message);cb([]);}
    );
  });
  return function(){if(unsub)unsub();};
}
function dbListenIn(col,f,vs,cb){
  var unsub=null;
  loadFB(function(db){
    if(!db){cb([]);return;}
    unsub=db.collection(col).where(f,'in',vs).limit(30).onSnapshot(
      function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));},
      function(){cb([]);}
    );
  });
  return function(){if(unsub)unsub();};
}
function dbAll(col,cb){loadFB(function(db){if(!db){cb([]);return;}db.collection(col).get().then(function(s){cb(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}));}).catch(function(){cb([]);});});}

function startApp(){
  if(!USER)return showRole();applyTheme();
  loadFeeConfig(); // Load admin-editable delivery fee config from Firestore
  if(USER.role==='customer')startCust();
  else if(USER.role==='rider'){
    // Prompt for M-Pesa if not saved (4C: prompt on first login)
    var rMpesa=USER.mpesa_phone||window._riderMpesa||'';
    if(!rMpesa||rMpesa.length<9){
      // Load from riders collection (might exist from earlier)
      loadFB(function(db){
        if(!db){showRiderMpesaPrompt();return;}
        db.collection('riders').doc(USER.phone).get().then(function(doc){
          var saved=doc.exists&&doc.data().mpesa_phone||'';
          if(saved&&saved.length>=9){
            window._riderMpesa=saved;USER.mpesa_phone=saved;su();
          } else {
            showRiderMpesaPrompt();
          }
        }).catch(function(){showRiderMpesaPrompt();});
      });
    }
    // Before showing jobs, check if rider has an active delivery
    // (assigned or picked) that was in progress when app was last closed.
    // Restore RACT so the active delivery appears correctly.
    loadFB(function(db){
      if(!db){showJobs();return;}
      db.collection('delivery_orders')
        .where('rider_phone','==',USER.phone)
        .where('status','in',['assigned','picked'])
        .limit(1)
        .get()
        .then(function(snap){
          if(!snap.empty){
            var d=snap.docs[0];
            RACT=Object.assign({id:d.id},d.data());
            // Map old 7-stage statuses to our simplified 3-stage flow
            var statusMap={'heading':'assigned','picked':'picked','transit':'picked','assigned':'assigned'};
            if(statusMap[RACT.status])RACT.status=statusMap[RACT.status];
            else if(['assigned','picked'].indexOf(RACT.status)<0)RACT.status='picked';
            dbSet('riders',USER.phone,{busy:true,online:true,name:USER.name,phone:USER.phone});
            console.log('Restored RACT:',RACT.id,'status:',RACT.status);
          }
          showJobs();
        })
        .catch(function(){showJobs();});
    });
  }
  else if(USER.role==='shop')startShop();
  else if(USER.role==='admin')showAOv();
  else showRole();
  // Set up push notifications in the BACKGROUND, after the screen has
  // already rendered — this keeps login feeling instant instead of
  // waiting on 2 extra Firebase script downloads first.
  if(USER.phone){
    loadFBExtras(function(){
      initFCM();
    });
  }
}

function placeOrder(payMethod,mpesaCode){
  if(!CART.length){toast('Cart is empty');return;}
  var shop=CS||{};
  var shopId=shop.id||CART[0].shopId||'';
  var sub=CART.reduce(function(s,i){return s+(i.price||0)*(i.qty||1);},0);
  var df=calcFee(CART[0].shopDist||.5);
  var addr=window._deliveryAddr||USER.name+' waiting';
  var orderData={
    type:'shop',
    customer_phone:USER.phone,
    customer_name:USER.name,
    shop_id:shopId,
    shopName:shop.name||CART[0].shopName||'',
    delivery_address:addr,
    items:CART.map(function(i){return{id:i.id,name:i.name,quantity:i.qty,price:i.price};}),
    subtotal:sub,delivery_fee:df,total:sub+df,
    rider_earnings:df,platform_earnings:0,
    distance:CART[0].shopDist||.5,
    status:'placed',payment_method:payMethod,
    rider_phone:null,rider_name:null
  };
  if(window._ordLat){orderData.delivery_lat=window._ordLat;orderData.delivery_lng=window._ordLng;}

  function doPlace(db){
    var savedCart=CART.slice();
    CART=[];window._ordLat=null;window._ordLng=null;window._deliveryAddr=null;
    hideSh();showOrds();toast('&#x23F3; Sending order...');
    db.collection('delivery_orders')
      .add(Object.assign({},orderData,{ts:firebase.firestore.FieldValue.serverTimestamp()}))
      .then(function(){// Check if any riders are online - warn customer if not
    loadFB(function(db){
      if(!db)return;
      db.collection('riders').where('online','==',true).where('verified','==',true).limit(1).get()
        .then(function(snap){
          if(snap.empty){
            toast('&#x26A0; Order placed! No riders online right now — you will be notified when a rider picks up your job.');
          } else {
            toast('&#x2705; Order placed! A rider will be assigned shortly.');
          }
        }).catch(function(){
          toast('&#x2705; Order placed! Track in My Orders.');
        });
    });})
      .catch(function(e){console.error('Order error:',e);CART=savedCart;toast('&#x26A0; Order failed. Try again.');showCart();});
  }

  loadFB(function(db){
    if(!db){toast('No connection — cannot place order');return;}
    // Try duplicate check (needs composite index — safe to skip if it fails)
    db.collection('delivery_orders')
      .where('customer_phone','==',USER.phone)
      .where('status','in',['placed','confirmed'])
      .get()
      .then(function(snap){
        // Check if any of the results are from the same shop
        var dup=snap.docs.some(function(d){return d.data().shop_id===shopId;});
        if(dup){
          hideSh();
          toast('You already have an active order from this shop. Track it in My Orders.');
          showOrds();
          return;
        }
        doPlace(db);
      })
      .catch(function(){
        // Composite index missing — place order without duplicate check
        doPlace(db);
      });
  });
}

  // ── Haversine distance between two GPS points ────────────────
  function haversineKm(lat1,lng1,lat2,lng2){
    var R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

              db.collection('shops').doc(USER.phone).collection('sales').doc(id).update({debt_paid:true,paid_at:Date.now()}).then(function(){toast('Marked as paid!');window._sv='debts';showSSales();}).catch(function(){toast('Error');});
            });
          });
        });
      }

      // ── HISTORY TAB (CHAWKPRO-style) ─────────────────────
      else if(isHistory){
        var paid2=allS.filter(function(x){return !x.is_debt;});
        var allCost2=paid2.reduce(function(s,x){return s+(x.cost||0);},0);
        var allRev=paid2.reduce(function(s,x){return s+(x.total||0);},0);
        var allProfit2=allRev-allCost2;
        // This week
        var weekAgo=Date.now()-7*24*3600*1000;
        var weekS=paid2.filter(function(x){return(x.created_at||0)>weekAgo;});
        var weekRev=weekS.reduce(function(s,x){return s+(x.total||0);},0);
        var weekCost=weekS.reduce(function(s,x){return s+(x.cost||0);},0);
        var weekProfit=weekRev-weekCost;
        // This month
        var now=new Date(); var monthStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
        var monthS=paid2.filter(function(x){return(x.created_at||0)>monthStart;});
        var monthRev=monthS.reduce(function(s,x){return s+(x.total||0);},0);
        var monthProfit=monthRev-monthS.reduce(function(s,x){return s+(x.cost||0);},0);

        // Summary cards
        var summH='<div style="margin-bottom:14px">'
          +'<div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Summary</div>'
          +'<div class="g2"><div class="sb2"><div class="sv" style="color:#10b981;font-size:16px">KSh '+weekRev.toLocaleString()+'</div><div class="sl">This Week Sales</div></div><div class="sb2"><div class="sv" style="color:#4ade80;font-size:16px">KSh '+weekProfit.toLocaleString()+'</div><div class="sl">This Week Profit</div></div></div>'
          +'<div class="g2"><div class="sb2"><div class="sv" style="color:#8b5cf6;font-size:16px">KSh '+monthRev.toLocaleString()+'</div><div class="sl">This Month Sales</div></div><div class="sb2"><div class="sv" style="color:#f59e0b;font-size:16px">KSh '+monthProfit.toLocaleString()+'</div><div class="sl">Month Profit</div></div></div>'
          +'<div class="sb2" style="text-align:center;margin-bottom:0"><div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:4px">All Time</div><div style="display:flex;justify-content:space-around"><div><div style="font-size:18px;font-weight:800;color:#10b981">KSh '+allRev.toLocaleString()+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Revenue</div></div><div><div style="font-size:18px;font-weight:800;color:#4ade80">KSh '+allProfit2.toLocaleString()+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Profit</div></div><div><div style="font-size:18px;font-weight:800;color:#fbbf24">'+paid2.length+'</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Sales</div></div></div></div>'
          +'</div>';

        // Daily breakdown
        var days={};
        paid2.forEach(function(x){
          var d=new Date(x.created_at||0);
          var key=d.toLocaleDateString('en-KE',{weekday:'short',day:'numeric',month:'short',year:'2-digit'});
          if(!days[key])days[key]={rev:0,cost:0,count:0,items:[]};
          days[key].rev+=(x.total||0);
          days[key].cost+=(x.cost||0);
          days[key].count++;
          days[key].items.push((x.product_name||'Item')+' KSh '+(x.total||0));
        });

        var dayKeys=Object.keys(days);
        var dayH='<div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">Daily Breakdown</div>';
        if(!dayKeys.length){dayH+=empty('&#x1F4C5;','No records yet','Start recording sales');}
        dayKeys.forEach(function(day){
          var d=days[day];
          var profit=d.rev-d.cost;
          dayH+='<div class="card" style="margin-bottom:9px">'
            +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
            +'<div style="font-weight:700;font-size:14px">'+day+'</div>'
            +'<div style="text-align:right"><div style="font-weight:800;color:#10b981">KSh '+d.rev.toLocaleString()+'</div>'
            +(profit>0?'<div style="font-size:11px;color:#4ade80">+KSh '+profit+' profit</div>':'')+'</div></div>'
            +'<div style="display:flex;gap:12px;font-size:11px;color:rgba(255,255,255,.4)">'
            +'<span>'+d.count+' sales</span>'
            +(d.cost>0?'<span>Cost: KSh '+d.cost+'</span>':'')
            +'</div>'
            +(d.items.length?'<div style="margin-top:6px;font-size:11px;color:rgba(255,255,255,.3)">'+d.items.slice(0,3).join(', ')+(d.items.length>3?' +'+( d.items.length-3)+' more':'')+'</div>':'')
            +'</div>';
        });

        // Product performance
        var prods={};
        paid2.forEach(function(x){
          var n=x.product_name||'Unknown';
          if(!prods[n])prods[n]={rev:0,count:0,profit:0};
          prods[n].rev+=(x.total||0);
          prods[n].count++;
          prods[n].profit+=(x.total||0)-(x.cost||0);
        });
        var prodKeys=Object.keys(prods).sort(function(a,b){return prods[b].rev-prods[a].rev;});
        var prodH='<div style="font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.5px;margin:14px 0 8px">Top Products</div>';
        prodKeys.slice(0,8).forEach(function(name){
          var p=prods[name];
          prodH+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">'
            +'<div><div style="font-weight:700;font-size:13px">'+name+'</div><div style="font-size:11px;color:rgba(255,255,255,.4)">'+p.count+' sold</div></div>'
            +'<div style="text-align:right"><div style="font-weight:800;color:#10b981">KSh '+p.rev.toLocaleString()+'</div>'
            +(p.profit>0?'<div style="font-size:10px;color:#4ade80">+KSh '+p.profit+' profit</div>':'')+'</div></div>';
        });

        // WhatsApp summary share
        var waText='*TUMANA Daily Summary - '+new Date().toLocaleDateString('en-KE')+'*\n\n'
          +'Today Sales: KSh '+paid2.filter(function(x){return new Date(x.created_at||0).toDateString()===new Date().toDateString();}).reduce(function(s,x){return s+(x.total||0);},0).toLocaleString()+'\n'
          +'This Week: KSh '+weekRev.toLocaleString()+' (Profit: KSh '+weekProfit.toLocaleString()+')\n'
          +'This Month: KSh '+monthRev.toLocaleString()+' (Profit: KSh '+monthProfit.toLocaleString()+')';
        var shareH='<a href="https://wa.me/?text='+encodeURIComponent(waText)+'" target="_blank" style="display:block;margin-top:14px;padding:13px;background:rgba(37,211,102,.1);border:1.5px solid rgba(37,211,102,.3);border-radius:10px;color:#25D366;text-align:center;font-weight:800;font-size:14px;text-decoration:none">&#x1F4F1; Share Summary on WhatsApp</a>';

        svd.innerHTML=summH+dayH+prodH+shareH;
      }

    }).catch(function(){
      var svd=document.getElementById('svdata');
      if(svd)svd.innerHTML=empty('&#x26A0;','Error loading','Check your connection and try again');
    });
  });
}
function showRecSale(){
  window._saleCart=window._saleCart||[];
  // Load stock once, then render form
  loadFB(function(db){
    if(!db){renderSaleCart([]);return;}
    db.collection('shops').doc(USER.phone).collection('stock').get().then(function(s){
      var items=s.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(i){return(i.quantity||0)>0;});
      renderSaleCart(items);
    }).catch(function(){renderSaleCart([]);});
  });
}

function renderSaleCart(stockItems){
  window._recStock=stockItems;

  // Build stock picker options
  var optsH='<option value="">-- Pick item to add --</option>';
  stockItems.forEach(function(it){
    optsH+='<option value="'+it.id+'">'+(it.emoji||'')+(it.emoji?' ':'')+it.name+' (KSh '+it.selling_price+' · '+(it.quantity||0)+' left)</option>';
  });
  optsH+='<option value="__custom">&#x270F;&#xFE0F; Other (type manually)</option>';

  function cartRows(){
    if(!window._saleCart.length) return '<div style="font-size:12px;color:rgba(255,255,255,.4);text-align:center;padding:12px 0">No items added yet</div>';
    return window._saleCart.map(function(it,i){
      return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;background:#1a1a22;border-radius:9px;padding:9px 10px">'
        +'<div style="flex:1"><div style="font-weight:700;font-size:13px">'+(it.emoji||'')+(it.emoji?' ':'')+it.name+'</div>'
        +'<div style="font-size:11px;color:rgba(255,255,255,.4)">KSh '+it.price+' each'+(it.cost?' · cost KSh '+it.cost:'')+'</div></div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<button class="qb qbm sc-m" data-i="'+i+'" style="background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)">&#x2212;</button>'
        +'<span style="font-weight:700;min-width:18px;text-align:center">'+it.qty+'</span>'
        +'<button class="qb qbp sc-p" data-i="'+i+'" style="background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)">+</button>'
        +'<button class="sc-del" data-i="'+i+'" style="background:none;border:none;color:#ef4444;font-size:16px;cursor:pointer;padding:0 2px">&#x1F5D1;</button>'
        +'</div>'
        +'<div style="font-size:13px;font-weight:800;color:#10b981;min-width:54px;text-align:right">KSh '+(it.price*it.qty)+'</div>'
        +'</div>';
    }).join('');
  }

  function cartTotal(){
    return window._saleCart.reduce(function(s,it){return s+it.price*it.qty;},0);
  }
  function cartProfit(){
    return window._saleCart.reduce(function(s,it){return s+(it.price-it.cost)*it.qty;},0);
  }

  function rebuildSh(){
    var sc=window._saleCart;
    var tot=cartTotal(); var prof=cartProfit(); var hasProfit=sc.some(function(x){return x.cost>0;});
    document.getElementById('sc-rows').innerHTML=cartRows();
    document.getElementById('sc-total').textContent='KSh '+tot.toLocaleString();
    if(hasProfit){var pe=document.getElementById('sc-profit');if(pe){pe.textContent='Profit: KSh '+prof.toLocaleString();pe.style.display='';}}
    // Rewire qty buttons
    document.getElementById('sc-rows').querySelectorAll('.sc-m').forEach(function(b){b.addEventListener('click',function(){var i=parseInt(this.dataset.i);sc[i].qty=Math.max(1,sc[i].qty-1);rebuildSh();});});
    document.getElementById('sc-rows').querySelectorAll('.sc-p').forEach(function(b){b.addEventListener('click',function(){var i=parseInt(this.dataset.i);sc[i].qty++;rebuildSh();});});
    document.getElementById('sc-rows').querySelectorAll('.sc-del').forEach(function(b){b.addEventListener('click',function(){var i=parseInt(this.dataset.i);sc.splice(i,1);rebuildSh();});});
  }

  showSh('<div class="hd"></div>'
    +'<div style="font-size:18px;font-weight:800;margin-bottom:14px">&#x1F4B0; Record Sale</div>'

    // ── Item picker ────────────────────────────────────────
    +'<div class="fld"><label>Add Item</label>'
    +(stockItems.length?'<select id="rcp-sel">'+optsH+'</select>'
      :'<input id="rcp-sel-c" type="text" placeholder="Item name (no stock loaded)">')
    +'</div>'
    +'<div id="custom-row" style="display:none">'
    +'<div class="fld"><label>Item Name</label><input id="rcp-cust" type="text" placeholder="e.g. Mandazi" autocomplete="off"></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px">'
    +'<div class="fld" style="margin-bottom:0"><label>Price (KSh)</label><input id="rcp-price" type="number" placeholder="60"></div>'
    +'<div class="fld" style="margin-bottom:0"><label>Cost (KSh)</label><input id="rcp-cost" type="number" placeholder="45"></div>'
    +'<div class="fld" style="margin-bottom:0"><label>Qty</label><input id="rcp-qty" type="number" placeholder="1" value="1"></div>'
    +'</div>'
    +'<button id="add-item-btn" class="btn bg" style="margin-bottom:14px;padding:11px">+ Add to Sale</button>'

    // ── Cart ───────────────────────────────────────────────
    +'<div style="background:rgba(16,185,129,.04);border:1.5px solid rgba(16,185,129,.15);border-radius:12px;padding:12px;margin-bottom:12px">'
    +'<div style="font-size:10px;font-weight:700;color:#10b981;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Items in this Sale</div>'
    +'<div id="sc-rows">'+cartRows()+'</div>'
    +'<div style="border-top:1px solid rgba(16,185,129,.15);margin-top:8px;padding-top:8px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><span style="font-size:13px;color:rgba(255,255,255,.4)">Total</span>'
    +'<div id="sc-profit" style="font-size:11px;color:#4ade80;'+(cartProfit()>0?'':'display:none')+'">Profit: KSh '+cartProfit()+'</div></div>'
    +'<span id="sc-total" style="font-size:22px;font-weight:800;color:#10b981">KSh '+cartTotal().toLocaleString()+'</span>'
    +'</div></div>'

    // ── Customer + payment ─────────────────────────────────
    +'<div class="fld"><label>Customer Name</label><input id="rcc" type="text" placeholder="e.g. Mama Jane (optional)" autocomplete="off"></div>'
    +'<div class="fld"><label>Customer Phone (for debt)</label><input id="rcph" type="tel" placeholder="07XX (optional)"></div>'
    +'<div style="margin-bottom:14px"><div style="font-size:12px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px">Payment</div>'
    +'<div style="display:flex;gap:8px">'
    +'<button id="ptc" class="btn bg" style="margin-top:0;font-size:12px;padding:10px;flex:1">Cash</button>'
    +'<button id="ptm" class="btn bo" style="margin-top:0;font-size:12px;padding:10px;flex:1">M-Pesa</button>'
    +'<button id="ptd" class="btn bo" style="margin-top:0;font-size:12px;padding:10px;flex:1;border-color:#ef4444;color:#ef4444">Debt</button>'
    +'</div></div>'
    +'<button id="ssb" class="btn ba">&#x1F4BE; Save Sale</button>'
    +'<button id="csb" class="btn bo">Cancel</button>'
  );

  // ── Wire up stock picker ─────────────────────────────────
  var selEl=document.getElementById('rcp-sel');
  if(selEl){
    selEl.addEventListener('change',function(){
      var cRow=document.getElementById('custom-row');
      if(this.value==='__custom'){
        cRow.style.display='';
        document.getElementById('rcp-price').value='';
        document.getElementById('rcp-cost').value='';
      } else if(this.value){
        cRow.style.display='none';
        var it=stockItems.filter(function(x){return x.id===this.value;}.bind(this))[0];
        if(it){document.getElementById('rcp-price').value=it.selling_price||0;document.getElementById('rcp-cost').value=it.cost_price||0;}
      } else {cRow.style.display='none';}
    });
  }

  // ── Add item to cart ─────────────────────────────────────
  document.getElementById('add-item-btn').addEventListener('click',function(){
    var sel=document.getElementById('rcp-sel');
    var selVal=sel?sel.value:'__custom';
    var name=''; var stockId=null; var emoji='';
    if(selVal&&selVal!=='__custom'){
      var it=stockItems.filter(function(x){return x.id===selVal;})[0];
      if(it){name=it.name;stockId=it.id;emoji=it.emoji||'';}
    } else {
      var custInp=document.getElementById('rcp-cust')||document.getElementById('rcp-sel-c');
      name=(custInp&&custInp.value||'').trim();
    }
    if(!name){toast(stockItems.length?'Select an item or choose "Other"':'Enter item name');return;}
    var price=parseFloat((document.getElementById('rcp-price')&&document.getElementById('rcp-price').value)||0)||0;
    var cost=parseFloat((document.getElementById('rcp-cost')&&document.getElementById('rcp-cost').value)||0)||0;
    var qty=parseInt((document.getElementById('rcp-qty')&&document.getElementById('rcp-qty').value)||1)||1;
    if(!price){toast('Enter selling price');return;}
    // Check if same item already in cart - increase qty
    var existing=window._saleCart.filter(function(x){return x.stockId===stockId&&x.name===name;})[0];
    if(existing){existing.qty+=qty;}
    else{window._saleCart.push({name:name,emoji:emoji,price:price,cost:cost,qty:qty,stockId:stockId});}
    // Reset picker
    if(sel){sel.value='';document.getElementById('custom-row').style.display='none';}
    document.getElementById('rcp-price').value='';
    document.getElementById('rcp-cost').value='';
    document.getElementById('rcp-qty').value='1';
    toast('Added: '+name);
    rebuildSh();
  });

  // Initial rewire of cart buttons
  rebuildSh();

  // ── Payment method ────────────────────────────────────────
  var pt='cash';
  function setPT(t){
    pt=t;var cols={cash:'#10b981',mpesa:'#3b82f6',debt:'#ef4444'};
    [['ptc','cash'],['ptm','mpesa'],['ptd','debt']].forEach(function(x){
      var el=document.getElementById(x[0]);if(!el)return;var a=x[1]===t;
      el.style.borderColor=a?cols[t]:'rgba(255,255,255,.2)';
      el.style.background=a?'rgba('+(t==='cash'?'16,185,129':t==='mpesa'?'59,130,246':'239,68,68')+',.15)':'transparent';
      el.style.color=a?cols[t]:'rgba(255,255,255,.6)';
    });
  }
  document.getElementById('ptc').addEventListener('click',function(){setPT('cash');});
  document.getElementById('ptm').addEventListener('click',function(){setPT('mpesa');});
  document.getElementById('ptd').addEventListener('click',function(){setPT('debt');});

  document.getElementById('csb').addEventListener('click',function(){window._saleCart=[];hideSh();});

  // ── Save sale ─────────────────────────────────────────────
  document.getElementById('ssb').addEventListener('click',function(){
    if(!window._saleCart.length){toast('Add at least one item');return;}
    var cust=(document.getElementById('rcc').value||'Walk-in').trim();
    var phone=(document.getElementById('rcph').value||'').trim();
    var tot=cartTotal(); var prof=cartProfit();
    var btn=document.getElementById('ssb');
    btn.textContent='Saving...';btn.disabled=true;

    loadFB(function(db){
      if(!db){toast('No connection');btn.textContent='Save Sale';btn.disabled=false;return;}
      var batch=db.batch();
      // Save each cart item as a sale record
      window._saleCart.forEach(function(it){
        var ref=db.collection('shops').doc(USER.phone).collection('sales').doc();
        batch.set(ref,{
          customer_name:cust,product_name:it.name,quantity:it.qty,
          selling_price:it.price,cost:it.cost*it.qty,total:it.price*it.qty,
          payment_type:pt,is_debt:pt==='debt',debt_paid:false,
          customer_phone:phone,created_at:Date.now(),shop_phone:USER.phone,
          stock_id:it.stockId||null,sale_group:Date.now()
        });
        // Decrement stock
        if(it.stockId){
          var src=stockItems.filter(function(x){return x.id===it.stockId;})[0];
          if(src){
            var newQty=Math.max(0,(src.quantity||0)-it.qty);
            var sRef=db.collection('shops').doc(USER.phone).collection('stock').doc(it.stockId);
            batch.update(sRef,{quantity:newQty});
          }
        }
      });
      batch.commit().then(function(){
        var summary=window._saleCart.length===1
          ? window._saleCart[0].name+' KSh '+tot
          : window._saleCart.length+' items, KSh '+tot;
        toast(pt==='debt'?'Debt: KSh '+tot+' by '+cust:(summary+(prof>0?' · Profit: KSh '+prof:'')));
        window._saleCart=[];
        hideSh();window._sv='sales';showSSales();
      }).catch(function(){toast('Error saving');btn.textContent='Save Sale';btn.disabled=false;});
    });
  });
}
function showSStock(){
  var el=document.getElementById('shc');if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:40px"><div class="spin" style="margin:0 auto"></div></div>';
  loadFB(function(db){
    if(!db){el.innerHTML='<div style="text-align:center;padding:30px;color:rgba(255,255,255,.4)">Connect to manage stock</div>';return;}
    db.collection('shops').doc(USER.phone).collection('stock').get().then(function(s){renderSStock(s.docs.map(function(d){return Object.assign({id:d.id},d.data());}),el);}).catch(function(){el.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.4)">Error loading stock</div>';});
  });
}
function renderSStock(items,el){
  window._stockPhotoMap={};
  items.forEach(function(it){if(it.photo)window._stockPhotoMap[it.id]=it.photo;});
  var low=items.filter(function(i){return(i.quantity||0)<5;});

  document.getElementById('rout').addEventListener('click',function(){if(confirm('Logout?'))logout();});

      }

function startJL(){
  if(RUNSUB){RUNSUB();RUNSUB=null;}
  if(!RACT){
    dbSet('riders',USER.phone,{busy:false,online:true,name:USER.name,phone:USER.phone});
  }
  var prevJobCount=RJOBS.length;
  RUNSUB=dbListenIn('delivery_orders','status',['confirmed'],function(jobs){
    var newJobs=RACT?[]:jobs.filter(function(j){return !j.rider_phone;});
    // Vibrate + alert when NEW job appears (count went up)
    if(!RACT && newJobs.length > prevJobCount){
      // Vibrate phone: 3 short pulses
      if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
      // Play a short beep using Web Audio API (no external file needed)
      try{
        var ctx=new(window.AudioContext||window.webkitAudioContext)();
        [0,0.3,0.6].forEach(function(t){
          var o=ctx.createOscillator();
          var g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.frequency.value=880;
          g.gain.setValueAtTime(0.4,ctx.currentTime+t);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.25);
          o.start(ctx.currentTime+t);
          o.stop(ctx.currentTime+t+0.25);
        });
      }catch(e){}
      // Flash the jobs counter badge
      var jcnt=document.getElementById('jcnt');
      if(jcnt){jcnt.style.animation='none';
        setTimeout(function(){jcnt.style.color='#ef4444';jcnt.style.transform='scale(1.4)';},10);
        setTimeout(function(){jcnt.style.color='#8b5cf6';jcnt.style.transform='';},800);
      }
    }
    prevJobCount=newJobs.length;
    RJOBS=newJobs;
    var cnt=document.getElementById('jcnt');if(cnt)cnt.textContent=RACT?0:RJOBS.length;
    var lbl=document.getElementById('jcnt-lbl');if(lbl)lbl.textContent=RACT?'ON DELIVERY':'AVAILABLE';
    renderRBody();
  });
}
function startAL(){
  if(RAUNSUB){RAUNSUB();RAUNSUB=null;}
  // CRITICAL: only treat 'assigned' or 'picked' as an ACTIVE delivery.
  // 'delivered' must NEVER match here — otherwise this live listener
  // keeps re-setting RACT to the just-completed order every time
  // Firestore fires the snapshot (including the very update that marks
  // it delivered), making it look like the job never finished.
  RAUNSUB=dbListen('delivery_orders','rider_phone','==',USER.phone,function(orders){
    var stillActive=orders.filter(function(o){return o.status==='assigned'||o.status==='picked';})[0]||null;
    RACT=stillActive;
    renderRBody();
  });
}

function accJob(jobId){
  // Block accepting if already on a delivery
  if(RACT){
    toast('Complete your current delivery first');
    return;
  }
  var job=null;RJOBS.forEach(function(j){if(j.id===jobId)job=j;});if(!job)return;
  var rMpesaToSave=USER.mpesa_phone||window._riderMpesa||'';
  dbUpd('delivery_orders',jobId,{rider_phone:USER.phone,rider_name:USER.name,rider_mpesa:rMpesaToSave,status:'assigned'},function(ok){
    if(!ok){toast('Error accepting - try again');return;}
    // Mark rider as busy in Firebase immediately — the Cloud Function
    // checks this before sending push notifications, so other jobs
    // won't ping this rider until completeDelivery() sets busy:false.
    dbSet('riders',USER.phone,{busy:true,online:true,name:USER.name,phone:USER.phone});
    RACT=Object.assign({},job,{status:'assigned',rider_phone:USER.phone,rider_name:USER.name});
    RJOBS=[]; // clear local job list immediately
    toast('Accepted! Head to '+(job.type==='pickup'?job.pickup_from:job.shopName||'the shop'));
    // Real-time listener on this specific order so status auto-syncs
    // (e.g. if admin resets it, rider's RACT auto-clears)
    if(window._ractUnsub)window._ractUnsub();
    loadFB(function(db){
      window._ractUnsub=db.collection('delivery_orders').doc(RACT.id).onSnapshot(function(doc){
        if(!doc.exists||!RACT||doc.id!==RACT.id)return;
        var d=doc.data();
        if(d.status==='confirmed'||d.status==='rejected'){
          // Order was reset/cancelled by admin/shop
          RACT=null;if(window._ractUnsub){window._ractUnsub();window._ractUnsub=null;}
          dbSet('riders',USER.phone,{busy:false});
          toast('Order was reset or cancelled by shop/admin');
          if(RON)startJL();
          renderRBody();
        }
      });
    });
    renderRBody();
  });
}
function advJob(){
  if(!RACT)return;
  var ns=NST[RACT.status];
  // If status isn't in NST (old/stuck status from before simplification),
  // don't silently fail — treat it as ready for payment collection.
  if(!ns){
    showCollectPayment(RACT);
    return;
  }
  // Special case: about to mark as delivered = collect payment first
  if(ns==='delivered'){
    showCollectPayment(RACT);
    return;
  }
  dbUpd('delivery_orders',RACT.id,{status:ns},function(){});
  RACT=Object.assign({},RACT,{status:ns});
  renderRBody();
}

// ── COMPLETE DELIVERY ────────────────────────────────────────────────
function completeDelivery(order,riderEarn,payMethod,mpesaCode){
  if(!order||!order.id){toast('Error: order data missing. Tap Back and try again.');return;}
  // Show loading on whichever confirm button was tapped
  var btn=document.getElementById('confirm-cash-pay')||document.getElementById('confirm-mpesa-pay');
  if(btn){btn.textContent='Completing...';btn.disabled=true;}

  // Clean up per-order real-time listener
  if(window._ractUnsub){try{window._ractUnsub();}catch(e){}window._ractUnsub=null;}

  var updateData={
    status:'delivered',
    rider_payment_method:payMethod,
    rider_mpesa_code:mpesaCode||'',
    delivered_at:Date.now()
  };

  loadFB(function(db){
    if(!db){
      if(btn){btn.textContent='No connection — tap again';btn.disabled=false;}
      toast('No connection. Check your data and try again.');
      return;
    }
    db.collection('delivery_orders').doc(order.id).update(updateData)
      .then(function(){
        // Update rider earnings and mark not busy
        db.collection('riders').doc(USER.phone).set({
          total_earnings:firebase.firestore.FieldValue.increment(riderEarn),
          orders_completed:firebase.firestore.FieldValue.increment(1),
          pending_payout:firebase.firestore.FieldValue.increment(riderEarn),
          busy:false
        },{merge:true}).catch(function(){});

        REARN=(REARN||0)+riderEarn;
        RACT=null;
        hideSh();
        toast('Delivery complete! KSh '+riderEarn+' earned');
        // Re-subscribe to new jobs now that rider is free
        if(RON)startJL();
        renderRBody();
      })
      .catch(function(e){
        console.error('completeDelivery error:',e);
        if(btn){btn.textContent='Error — tap to retry';btn.disabled=false;}
        toast('Error completing delivery: '+(e.message||'check connection')+'  — tap button again');
      });
  });
}

function showAOrds(initFilter){
  setNav('admin','orders');
  var f=initFilter||'all';
  function btnStyle(key){return key===f?'btn bg':'btn bo';}
  pg().innerHTML='<div style="padding:16px 18px 0"><div style="font-size:19px;font-weight:800;margin-bottom:4px">All Orders</div></div>'
    +'<div style="display:flex;gap:5px;padding:0 18px 10px;overflow-x:auto">'
    +'<button id="ord-all" class="'+btnStyle('all')+'" style="margin-top:0;flex-shrink:0;font-size:11px;padding:6px 12px">All</button>'
    +'<button id="ord-pend" class="'+btnStyle('pending')+'" style="margin-top:0;flex-shrink:0;font-size:11px;padding:6px 12px">Pending</button>'
    +'<button id="ord-active" class="'+btnStyle('active')+'" style="margin-top:0;flex-shrink:0;font-size:11px;padding:6px 12px">Active</button>'
    +'<button id="ord-done" class="'+btnStyle('done')+'" style="margin-top:0;flex-shrink:0;font-size:11px;padding:6px 12px">Delivered</button>'
    +'</div>'
    +'<div id="ab" style="padding:0 18px 100px"><div style="text-align:center;padding:40px"><div class="spin" style="margin:0 auto"></div></div></div>';
  var allOrds=[];
  var filters={
    all:function(o){return true;},
    pending:function(o){return o.status==='placed';},
    active:function(o){return['confirmed','assigned','heading','picked','transit'].indexOf(o.status)>=0;},
    done:function(o){return o.status==='delivered';}
  };
  function setActive(key){
    ['all','pend','active','done'].forEach(function(k){
      var btn=document.getElementById('ord-'+k);if(!btn)return;
      var match=(k==='pend'?'pending':k)===key;
      btn.className=match?'btn bg':'btn bo';
    });
  }
  function renderOrds(list){
    var ab=document.getElementById('ab');if(!ab)return;
    if(!list.length){ab.innerHTML=empty('&#x1F4CB;','No orders here','');return;}
    ab.innerHTML=list.map(function(o){
      return '<div class="card" style="margin-bottom:10px;border-left:3px solid '+(o.status==='delivered'?'#10b981':o.status==='placed'?'#f59e0b':o.status==='rejected'?'#ef4444':'#8b5cf6')+'">'
        +'<div style="display:flex;justify-content:space-between;margin-bottom:6px">'
        +'<div><div style="font-weight:700">#'+o.id.slice(-6).toUpperCase()+'</div>'
        +'<div style="font-size:11px;color:rgba(255,255,255,.4)">'+(o.type==='pickup'?'&#x1F6F5; Pickup':'&#x1F6D2; Shop')+' · '+(o.customer_name||'')+'</div>'
        +(o.delivery_address?'<div style="font-size:11px;color:rgba(255,255,255,.35)">&#x1F4CD; '+(o.delivery_address||'')+(o.delivery_description?' · '+o.delivery_description:'')+'</div>':'')
        +'</div><span class="badge '+(SCLS[o.status]||'bpl')+'">'+(SLBL[o.status]||o.status)+'</span></div>'
        +'<div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.4);margin-bottom:6px">'
        +'<span>KSh '+(o.total||0)+'</span>'
        +'<span>'+(o.rider_name?'&#x1F6F5; '+o.rider_name:'No rider')+'</span>'
        +'<span>'+(o.payment_method==='cash'?'&#x1F4B5; Cash':'&#x1F4F1; M-Pesa')+'</span>'
        +'</div>'
        +((['assigned','picked'].indexOf(o.status)>=0)?'<div style="display:flex;gap:6px"><button class="ord-reset btn ba" data-id="'+o.id+'" style="margin-top:0;font-size:11px;padding:7px">&#x1F504; Reset to Available</button><button class="ord-rej btn br" data-id="'+o.id+'" style="margin-top:0;font-size:11px;padding:7px">&#x274C; Reject</button></div>':'')
        +(o.status==='placed'?'<button class="ord-confirm btn bg" data-id="'+o.id+'" style="margin-top:4px;font-size:11px;padding:7px">&#x2705; Force Confirm (Admin)</button>':'')
        +'</div>';
    }).join('');
  }
  dbAll('delivery_orders',function(orders){
    allOrds=orders.sort(function(a,b){return(b.ts&&b.ts.seconds||0)-(a.ts&&a.ts.seconds||0);});
    renderOrdsAndWire(allOrds.filter(filters[f]));
    var pendCount=allOrds.filter(filters.pending).length;
    if(pendCount&&document.getElementById('ord-pend')){
      document.getElementById('ord-pend').textContent='Pending ('+pendCount+')';
    }
  });
  function wireOrdButtons(){
    document.getElementById('ab').querySelectorAll('.ord-reset').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Reset this order? The current rider will be removed and order re-opens for any rider.'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({
            status:'confirmed',rider_phone:null,rider_name:null,assigned_at:null
          }).then(function(){toast('&#x2705; Order reset — available for riders');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error resetting order');});
        });
      });
    });
    document.getElementById('ab').querySelectorAll('.ord-rej').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Reject this order?'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({status:'rejected'})
          .then(function(){toast('Order rejected');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error');});
        });
      });
    });
    document.getElementById('ab').querySelectorAll('.ord-confirm').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=this.getAttribute('data-id');
        if(!confirm('Force confirm this order? Riders will be notified.'))return;
        loadFB(function(db){
          db.collection('delivery_orders').doc(id).update({status:'confirmed'})
          .then(function(){toast('&#x2705; Order confirmed — riders notified');renderOrds(allOrds.filter(filters[f]));})
          .catch(function(){toast('Error');});
        });
      });
    });
  }

  function renderOrdsAndWire(list){renderOrds(list);wireOrdButtons();}

  document.getElementById('ord-all').addEventListener('click',function(){setActive('all');renderOrdsAndWire(allOrds.filter(filters.all));});
  document.getElementById('ord-pend').addEventListener('click',function(){setActive('pending');renderOrdsAndWire(allOrds.filter(filters.pending));});
  document.getElementById('ord-active').addEventListener('click',function(){setActive('active');renderOrdsAndWire(allOrds.filter(filters.active));});
  document.getElementById('ord-done').addEventListener('click',function(){setActive('done');renderOrdsAndWire(allOrds.filter(filters.done));});

function showShopDetail(shopId, shopName){
  showSh('<div class="hd"></div>'
    +'<div style="font-size:18px;font-weight:800;margin-bottom:4px">'+shopName+'</div>'
    +'<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:14px">Shop Details</div>'
    +'<div id="sd-body"><div style="text-align:center;padding:30px"><div class="spin" style="margin:0 auto"></div></div></div>'
    +'<button id="sd-close" class="btn bo" style="margin-top:12px">Close</button>'
  );
  document.getElementById('sd-close').addEventListener('click',hideSh);
  loadFB(function(db){
    if(!db){document.getElementById('sd-body').innerHTML='<div style="color:rgba(255,255,255,.4);text-align:center">Connect to load</div>';return;}
    Promise.all([
      db.collection('shops').doc(shopId).get(),
      db.collection('delivery_orders').where('shop_id','==',shopId).limit(20).get(),
      db.collection('shops').doc(shopId).collection('sales').limit(5).get()
    ]).then(function(results){
      var shop=results[0].exists?results[0].data():{};
      var orders=results[1].docs.map(function(d){return Object.assign({id:d.id},d.data());});
      var sales=results[2].docs.map(function(d){return d.data();});
      var pending=orders.filter(function(o){return o.status!=='delivered'&&o.status!=='rejected';});
      var delivered=orders.filter(function(o){return o.status==='delivered';});
      var todayS=sales.filter(function(s){return new Date(s.created_at||0).toDateString()===new Date().toDateString();});
      var todayRev=todayS.reduce(function(s,x){return s+(x.total||0);},0);
      var clr=shop.verified===true?'#10b981':shop.verified===false?'#ef4444':'#f59e0b';
      var status=shop.verified===true?'Verified':shop.verified===false?'Rejected':'Pending';
      var sdb=document.getElementById('sd-body');if(!sdb)return;
      sdb.innerHTML=
        '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">'
        +'<div class="sb2"><div class="sv" style="color:#f59e0b;font-size:18px">'+pending.length+'</div><div class="sl">Pending</div></div>'
        +'<div class="sb2"><div class="sv" style="color:#10b981;font-size:18px">'+delivered.length+'</div><div class="sl">Delivered</div></div>'
        +'<div class="sb2"><div class="sv" style="color:#8b5cf6;font-size:18px">KSh '+todayRev+'</div><div class="sl">Today</div></div>'

function loadAdmList(){
  var list=document.getElementById('adm-list');if(!list)return;
  loadFB(function(db){
    if(!db){list.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:13px">Connect to load</div>';return;}
    db.collection('admins').get().then(function(s){
      if(!s.docs.length){list.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:13px;text-align:center;padding:12px">No extra admins added yet</div>';return;}
      var h='';
      s.docs.forEach(function(doc){
        var d=doc.data();
        h+='<div class="card" style="margin-bottom:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">'
          +'<div><div style="font-weight:700;font-size:14px">'+(d.name||d.phone)+'</div>'

function showItemSearch(query){
  if(!query){toast('Enter item name to search');return;}
  setTitle('SEARCH','#10b981');
  setNav('customer','home');
  pg().innerHTML='<div style="padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07)">'
    +'<button id="back-search" style="background:#1a1a22;border:1px solid rgba(255,255,255,.13);border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;margin-bottom:10px;font-family:inherit">&#x2190; Back</button>'
    +'<div style="font-size:16px;font-weight:700;margin-bottom:2px">&#x1F50D; "'+query+'"</div>'
    +'<div style="font-size:12px;color:rgba(255,255,255,.4)">Searching across all shops...</div>'
    +'</div>'
    +'<div id="search-results" style="padding:10px 18px 100px"><div style="text-align:center;padding:40px"><div class="spin" style="margin:0 auto"></div></div></div>';
  document.getElementById('back-search').addEventListener('click',showHome);

  loadFB(function(db){
    if(!db){document.getElementById('search-results').innerHTML=empty('&#x1F50D;','Connect to search','');return;}
    var q=query.toLowerCase();
    // Search across ALL shops stock using collectionGroup
    db.collectionGroup('stock').get().then(function(snap){
      var results=[];
      snap.docs.forEach(function(doc){
        var p=Object.assign({id:doc.id},doc.data());
        var shopPhone=doc.ref.parent.parent.id;
        // Match on name or description
        var nameMatch=(p.name||'').toLowerCase().indexOf(q)>=0;
        var descMatch=(p.description||'').toLowerCase().indexOf(q)>=0;
        if((nameMatch||descMatch)&&(p.quantity||0)>0&&(p.selling_price||0)>0){
          p._shopPhone=shopPhone;
          results.push(p);
        }
      });
      // Also search by shop name
      var shopMatches=SHOPS.filter(function(s){return(s.name||'').toLowerCase().indexOf(q)>=0||(s.category||'').toLowerCase().indexOf(q)>=0;});

      var sr=document.getElementById('search-results');if(!sr)return;
      var h='';
      if(results.length){
        h+='<div style="font-size:10px;font-weight:700;color:#10b981;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px">'+results.length+' item'+(results.length>1?'s':'')+' found</div>';
        results.forEach(function(p){
          var shop=SHOPS.filter(function(s){return s.id===p._shopPhone;})[0];
          var shopName=shop?shop.name:p._shopPhone;
          h+='<div class="card" style="display:flex;gap:10px;align-items:center;margin-bottom:9px;cursor:pointer" data-shop="'+p._shopPhone+'">'
            +(p.photo?'<img src="'+p.photo+'" style="width:56px;height:56px;border-radius:9px;object-fit:cover;flex-shrink:0">':'<div style="width:56px;height:56px;border-radius:9px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0">'+(p.emoji||'&#x1F6D2;')+'</div>')
            +'<div style="flex:1"><div style="font-weight:700;font-size:14px">'+p.name+'</div>'
            +(p.description?'<div style="font-size:11px;color:rgba(255,255,255,.4)">'+p.description+'</div>':'')
            +'<div style="font-size:12px;color:rgba(255,255,255,.4);margin-top:2px">&#x1F3EA; '+shopName+'</div></div>'
            +'<div style="text-align:right;flex-shrink:0"><div style="font-weight:800;color:#10b981;font-size:16px">KSh '+p.selling_price+'</div>'
            +'<div style="font-size:10px;color:rgba(255,255,255,.35);margin-top:2px">'+( p.quantity||0)+' left</div></div></div>';
        });
      }
      if(shopMatches.length){
        h+='<div style="font-size:10px;font-weight:700;color:#8b5cf6;text-transform:uppercase;letter-spacing:1.5px;margin:'+(results.length?'14px 0 8px':'0 0 8px')+'">Shops matching</div>';
        shopMatches.forEach(function(s){
          h+='<div class="card sg" data-id="'+s.id+'" style="display:flex;gap:10px;align-items:center;cursor:pointer"><div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:20px">'+s.icon+'</div><div><div style="font-weight:700">'+s.name+'</div><div style="font-size:12px;color:rgba(255,255,255,.4)">'+s.category+' · '+s.location+'</div></div></div>';
        });
      }
      if(!results.length&&!shopMatches.length){
        h=empty('&#x1F50D;','Nothing found for "'+query+'"','Try a different name or browse shops');
      }
      sr.innerHTML=h;
      // Click item → go to that shop
      sr.querySelectorAll('[data-shop]').forEach(function(el){el.addEventListener('click',function(){showProds(this.getAttribute('data-shop'));});});
      sr.querySelectorAll('.sg').forEach(function(el){el.addEventListener('click',function(){showProds(this.getAttribute('data-id'));});});
    }).catch(function(){
      var sr=document.getElementById('search-results');
      if(sr)sr.innerHTML=empty('&#x26A0;','Search error','Check connection and try again');
    });
  });
}

    +'<div class="fld"><label>M-Pesa Till / Phone Number</label>'
    +'<input id="fee-till" type="tel" value="'+till+'" placeholder="07XX or Till No" autocomplete="off"></div>'
    +'<div style="background:#1a1a22;border-radius:10px;padding:12px;margin-bottom:12px">'
    +'<div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Fee Preview</div>'
    +'<div id="fee-preview" style="font-size:14px;color:#10b981">KSh 50 base + KSh 20 × 1km = KSh 70</div>'
    +'</div>'
    +'<button id="save-fees-btn" class="btn bg">Save Settings</button>'
    +'<button id="cancel-fees-btn" class="btn bo">Cancel</button>'
  );
  function updatePreview(){
    var b=parseInt(document.getElementById('fee-base').value)||50;
    var k=parseInt(document.getElementById('fee-km').value)||20;
    var p=document.getElementById('fee-preview');
    if(p)p.textContent='KSh '+b+' base + KSh '+k+' × 1km = KSh '+(b+k)+' (1km example)';
  }
  ['fee-base','fee-km'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.addEventListener('input',updatePreview);
  });
  document.getElementById('cancel-fees-btn').addEventListener('click',hideSh);
  document.getElementById('save-fees-btn').addEventListener('click',function(){
    var b=parseInt(document.getElementById('fee-base').value)||50;
    var k=parseInt(document.getElementById('fee-km').value)||20;
    var t=(document.getElementById('fee-till').value||'').trim();
    if(b<20){toast('Base fee too low (min KSh 20)');return;}
    if(k<5){toast('Per km rate too low (min KSh 5)');return;}
    if(!t){toast('Enter M-Pesa till or phone number');return;}
    var btn=document.getElementById('save-fees-btn');
    btn.textContent='Saving...';btn.disabled=true;
    loadFB(function(db){
      if(!db){toast('No connection');btn.textContent='Save Settings';btn.disabled=false;return;}
      db.collection('platform_config').doc('fees').set({
        base_fee:b,per_km_rate:k,mpesa_till:t,updated_at:Date.now(),updated_by:USER.phone
      }).then(function(){
        window._ADMIN_BASE_FEE=b;window._ADMIN_PER_KM=k;window._ADMIN_TILL=t;
        window.MP=t; // also update the local MP variable
        toast('✅ Settings saved! Base KSh '+b+', KSh '+k+'/km, Till: '+t);
        hideSh();
        showAOv(); // refresh admin overview
      }).catch(function(){toast('Error saving');btn.textContent='Save Settings';btn.disabled=false;});
    });
  });
}

// ── SUPPRESS PWA INSTALL PROMPT / URL-share popup ─────────────────
// The browser shows an "install app" / "add to home screen" banner
// by default in the Android notification area when visiting a PWA.
// Capture and suppress the event so it never auto-shows.
// (User can still install via Chrome's ⋮ menu → Add to Home Screen)
// Suppress Chrome PWA install / share-link banner from appearing
// in the notification bar or at the bottom of the screen automatically.
// The user can still install via Chrome ⋮ → Add to Home Screen.
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  window._installPrompt=e;
  return false;
});
// Suppress "App available" app banner on Android
window.addEventListener('appinstalled',function(e){

});

// ── OFFLINE STATUS BANNER ───────────────────────────────────────────
function updateOnlineStatus(){
  var existing=document.getElementById('offline-banner');
  if(!navigator.onLine){
    if(!existing){
      var b=document.createElement('div');
      b.id='offline-banner';
      b.style.cssText='position:fixed;top:38px;left:0;right:0;max-width:430px;margin:0 auto;background:#f59e0b;color:#000;text-align:center;padding:6px;font-size:12px;font-weight:700;z-index:9997';
      b.textContent='\u26A0\uFE0F You are offline - some features unavailable';
      document.body.appendChild(b);
    }
  } else if(existing){existing.remove();}
}
window.addEventListener('online',updateOnlineStatus);
window.addEventListener('offline',updateOnlineStatus);

// ── BACK BUTTON: ask before exiting the app ─────────────────────────
var _exitConfirmed=false;
window.history.pushState(null,'',window.location.href);
window.addEventListener('popstate',function(){
  if(_exitConfirmed) return; // already confirmed, let it close naturally
  // Re-trap this back press, then ask the user
  window.history.pushState(null,'',window.location.href);
  showExitConfirm();
});

function showExitConfirm(){
  showSheet('<div class="hd"></div>'
    +'<div style="text-align:center;padding:8px 0 4px">'
    +'<div style="font-size:38px;margin-bottom:10px">&#x1F6AA;</div>'
    +'<div style="font-size:17px;font-weight:800;margin-bottom:6px">Exit Tumana?</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,.4);margin-bottom:18px">You will need to reopen the app to continue</div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">'
    +'<button id="exit-no" class="btn bo" style="margin-top:0">Stay</button>'
    +'<button id="exit-yes" class="btn br" style="margin-top:0">Exit App</button>'
    +'</div>'
  );
  document.getElementById('exit-no').addEventListener('click',hideSh);
  document.getElementById('exit-yes').addEventListener('click',function(){
    _exitConfirmed=true;
    hideSh();
    window.history.back();
  });
}

function renderCurrentView(){
  if(USER){
    if(USER.role==='customer')showHome();
    else if(USER.role==='rider'){
    // Prompt for M-Pesa if not saved (4C: prompt on first login)
    var rMpesa=USER.mpesa_phone||window._riderMpesa||'';
    if(!rMpesa||rMpesa.length<9){
      // Load from riders collection (might exist from earlier)
      loadFB(function(db){
        if(!db){showRiderMpesaPrompt();return;}
        db.collection('riders').doc(USER.phone).get().then(function(doc){
          var saved=doc.exists&&doc.data().mpesa_phone||'';
          if(saved&&saved.length>=9){
            window._riderMpesa=saved;USER.mpesa_phone=saved;su();
          } else {
            showRiderMpesaPrompt();
          }
        }).catch(function(){showRiderMpesaPrompt();});
      });
    }
    // Before showing jobs, check if rider has an active delivery
    // (assigned or picked) that was in progress when app was last closed.
    // Restore RACT so the active delivery appears correctly.
    loadFB(function(db){
      if(!db){showJobs();return;}
      db.collection('delivery_orders')
        .where('rider_phone','==',USER.phone)
        .where('status','in',['assigned','picked'])
        .limit(1)
        .get()
        .then(function(snap){
          if(!snap.empty){
            var d=snap.docs[0];
            RACT=Object.assign({id:d.id},d.data());
            // Map old 7-stage statuses to our simplified 3-stage flow
            var statusMap={'heading':'assigned','picked':'picked','transit':'picked','assigned':'assigned'};
            if(statusMap[RACT.status])RACT.status=statusMap[RACT.status];
            else if(['assigned','picked'].indexOf(RACT.status)<0)RACT.status='picked';
            dbSet('riders',USER.phone,{busy:true,online:true,name:USER.name,phone:USER.phone});
            console.log('Restored RACT:',RACT.id,'status:',RACT.status);
          }
          showJobs();
        })
        .catch(function(){showJobs();});
    });
  }
    else if(USER.role==='shop')renderShopDash();
    else if(USER.role==='admin')showAOv();
  } else {showRole();}
}

  // Ownership verification stamp - DO NOT REMOVE
