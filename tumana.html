function showAdminUsers(){
  if(!USER||!USER.is_master){toast('Master admin only');return;}
  showSh('<div class="hd"></div>'
    +'<div style="font-size:18px;font-weight:800;margin-bottom:4px">Admin Users</div>'
    +'<div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:16px">Only you can add or remove admins</div>'
    +'<div class="fld"><label>Phone Number to Add</label><input id="adm-ph" type="tel" placeholder="07XX XXX XXX" autocomplete="off"></div>'
    +'<div class="fld"><label>Name (optional)</label><input id="adm-nm" type="text" placeholder="e.g. John Supervisor" autocomplete="off"></div>'
    +'<button id="add-adm" class="btn bp">Add Admin</button>'
    +'<div style="margin-top:16px;font-size:11px;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Current Admins</div>'
    +'<div id="adm-list"><div style="text-align:center;padding:20px"><div class="spin" style="margin:0 auto"></div></div></div>'
    +'<button id="close-adm" class="btn bo" style="margin-top:12px">Close</button>'
  );
  document.getElementById('close-adm').addEventListener('click',hideSh);
  document.getElementById('add-adm').addEventListener('click',function(){
    var phone=(document.getElementById('adm-ph').value||'').trim().replace(/\s/g,'');
    var name=(document.getElementById('adm-nm').value||'').trim();
    if(!phone||phone.length<9){toast('Enter valid phone number');return;}
    var norm=phone.replace(/^[+]?254/,'0').replace(/^00/,'0');
    if(norm===SADMIN){toast('That is the master admin number');return;}
    loadFB(function(db){
      if(!db){toast('No connection');return;}
      db.collection('admins').doc(norm).set({phone:norm,name:name||norm,approved:true,added_by:USER.phone,added_at:Date.now()}).then(function(){
        toast('Admin added: '+( name||norm));
        document.getElementById('adm-ph').value='';
        document.getElementById('adm-nm').value='';
        loadAdmList();
      }).catch(function(){toast('Error adding');});
    });
  });
  loadAdmList();
}
function loadAdmList(){
  var list=document.getElementById('adm-list');if(!list)return;
  loadFB(function(db){
    if(!db){list.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:13px">Connect to load</div>';return;}
    db.collection('admins').get().then(function(s){
      if(!s.docs.length){list.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:13px;text-align:center;padding:12px">No extra admins added yet</div>';return;}
      var h='';
      s.docs.forEach(function(doc){
        var d=doc.data();
        h+='<div class="card" style="margin-bottom:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">'
          +'<div><div style="font-weight:700;font-size:14px">'+(d.name||d.phone)+'</div>'
          +'<div style="font-size:11px;color:rgba(255,255,255,.4)">'+d.phone+'</div></div>'
          +'<button class="rem-adm btn br" data-id="'+doc.id+'" data-name="'+(d.name||d.phone)+'" style="margin-top:0;font-size:11px;padding:5px 12px;width:auto">Remove</button>'
          +'</div>';
      });
      list.innerHTML=h;
      list.querySelectorAll('.rem-adm').forEach(function(btn){
        btn.addEventListener('click',function(){
          var id=this.getAttribute('data-id');var nm=this.getAttribute('data-name');
          if(!confirm('Remove admin access for '+nm+'?'))return;
          loadFB(function(db){
            if(!db){toast('No connection');return;}
            db.collection('admins').doc(id).delete().then(function(){toast('Removed: '+nm);loadAdmList();}).catch(function(){toast('Error');});
          });
        });
      });
    }).catch(function(){list.innerHTML='<div style="color:rgba(255,255,255,.4);font-size:13px">Error loading</div>';});
  });
}
